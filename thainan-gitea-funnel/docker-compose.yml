version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: gitea_server_1
      APP_PORT: 8085
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: gitea
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/tailscale
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        S=/tmp/tailscaled.sock
        tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale --socket=$$S &
        TD=$$!
        sleep 3
        # Sem timeout: espera a aprovação do link pelo tempo que for (o link fica no log do app).
        until tailscale --socket=$$S up --hostname=gitea --accept-dns=false; do sleep 10; done
        until tailscale --socket=$$S funnel --bg --https=443 http://gitea_server_1:8085; do sleep 10; done
        tailscale --socket=$$S status
        wait $$TD
