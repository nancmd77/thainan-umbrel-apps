version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: gitea_server_1
      APP_PORT: 8085
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    hostname: gitea
    restart: unless-stopped
    environment:
      TS_HOSTNAME: gitea
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/tailscale
      - ${APP_DATA_DIR}/serve.json:/config/serve.json:ro
