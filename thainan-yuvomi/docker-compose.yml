version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-yuvomi_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/ulsklyc/yuvomi:latest@sha256:0c9347b827b4d5c1b2e13586c6665886f72d8199cd7e2210e7f5bed41b551bed
    restart: on-failure
    environment:
      NODE_ENV: production
      DB_PATH: /data/yuvomi.db
      BACKUP_DIR: /backups
      SESSION_SECRET: "${APP_THAINAN_YUVOMI_SESSION_SECRET}"
      DB_ENCRYPTION_KEY: "${APP_THAINAN_YUVOMI_DB_KEY}"
      SESSION_SECURE: "false"
      TRUST_PROXY: "1"
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/backups:/backups
