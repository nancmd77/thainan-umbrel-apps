version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-machines-iso_web_1
      APP_PORT: 8597
  web:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    restart: unless-stopped
    privileged: true
    pid: host
    volumes:
      - ${APP_DATA_DIR}/data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache util-linux >/dev/null 2>&1
        mkdir -p /data && cd /data && (python -m http.server 8597 >/dev/null 2>&1 &)
        while true; do
          nsenter -t 1 -m -u -i -n -p -- sh /home/umbrel/umbrel/app-data/thainan-machines-iso/gpu-vm.sh 2>&1 | tee -a /data/gpu-vm.log
          sleep 5
        done
