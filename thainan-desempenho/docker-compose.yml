version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: 10.21.0.1
      APP_PORT: 8532
  tuner:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /lib/modules:/lib/modules:ro
    environment:
      NIC: enp64s0
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache ethtool kmod >/dev/null 2>&1 || true
        w() { [ -w "$$1" ] && echo "$$2" > "$$1" 2>/dev/null; }
        apply() {
          w /sys/devices/system/cpu/intel_pstate/no_turbo 0
          for c in /sys/devices/system/cpu/cpu[0-9]*/cpufreq; do w $$c/scaling_governor powersave; w $$c/energy_performance_preference balance_performance; done
          modprobe tcp_bbr 2>/dev/null
          s() { w /proc/sys/$$(echo $$1 | tr . /) "$$2"; }
          s net.core.default_qdisc fq
          s net.ipv4.tcp_congestion_control bbr
          s net.core.rmem_max 16777216; s net.core.wmem_max 16777216
          s net.core.rmem_default 1048576; s net.core.wmem_default 1048576
          s net.ipv4.tcp_rmem "4096 131072 16777216"; s net.ipv4.tcp_wmem "4096 65536 16777216"
          s net.core.netdev_max_backlog 16384; s net.core.somaxconn 8192
          s net.ipv4.tcp_fastopen 3; s net.ipv4.tcp_mtu_probing 1
          s net.ipv4.tcp_slow_start_after_idle 0
          s net.ipv4.udp_rmem_min 16384; s net.ipv4.udp_wmem_min 16384
          w /sys/class/net/$$NIC/device/power/control on
          w /sys/module/pcie_aspm/parameters/policy performance
          ethtool --set-eee $$NIC eee off 2>/dev/null
          M=$$(ethtool -g $$NIC 2>/dev/null | awk '/Pre-set/{p=1} p&&/^RX:/{print $$2; exit}')
          [ -n "$$M" ] && ethtool -G $$NIC rx $$M tx $$M 2>/dev/null
          tc qdisc replace dev $$NIC root fq 2>/dev/null || true
        }
        status() {
          {
          echo "Atualizado: $$(date)"
          echo "Turbo desligado? $$(cat /sys/devices/system/cpu/intel_pstate/no_turbo)  (0 = turbo ligado)"
          echo "Governor: $$(cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor)  EPP: $$(cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference)"
          echo "TCP: $$(cat /proc/sys/net/ipv4/tcp_congestion_control)  qdisc: $$(cat /proc/sys/net/core/default_qdisc)  rmem_max: $$(cat /proc/sys/net/core/rmem_max)"
          echo "ASPM: $$(cat /sys/module/pcie_aspm/parameters/policy)  NIC PM: $$(cat /sys/class/net/$$NIC/device/power/control)"
          echo "EEE: $$(ethtool --show-eee $$NIC 2>/dev/null | grep -i 'EEE status' | head -1)"
          echo "Temperatura CPU: $$(( $$(cat /sys/class/hwmon/hwmon7/temp1_input 2>/dev/null || echo 0) / 1000 )) C"
          } > /tmp/w/index.txt 2>&1
        }
        mkdir -p /tmp/w
        python -c "
        import http.server,os
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
        b=('<!doctype html><meta charset=utf-8><meta name=viewport content=width=device-width><body style=\"font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px\"><h1>Desempenho</h1><pre style=\"background:#f4f4f5;padding:12px;border-radius:8px\">'+open('/tmp/w/index.txt').read()+'</pre>').encode()
        self.send_response(200);self.send_header('Content-Type','text/html; charset=utf-8');self.end_headers();self.wfile.write(b)
            def log_message(self,*a):pass
        http.server.ThreadingHTTPServer(('10.21.0.1',8532),H).serve_forever()
        " &
        while true; do apply; status; sleep 300; done
