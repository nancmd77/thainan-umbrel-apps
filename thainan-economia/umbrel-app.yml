releaseNotes: >-
  Versão 1.1.0: painel de controle completo (perfis, controles individuais, estado com perfil ativo ou Personalizado, POST com validação no servidor). Estado salvo em /data/estado.json. Modo simulado via ECONOMIA_SIMULADO=1. Código do painel embutido no docker-compose.yml. Atualização automática do painel removida; use o botão Atualizar.
