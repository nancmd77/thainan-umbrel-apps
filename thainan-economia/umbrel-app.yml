description: >-
  Modo economia do Nonve: CPU com limites restaurados de fábrica (ou ajustáveis via variável de ambiente CPU_W), turbo ativado por padrão (ajustável via TURBO), EPP power, ASPM powersupersave (placa de rede preservada), RTX removida do barramento PCI e tentativa de travar a carga da bateria em 80%. Reaplica a cada 5 minutos e no boot. Página de status com potência medida, limites, RTX e bateria. Parar o app não restaura nada até o próximo reboot.
