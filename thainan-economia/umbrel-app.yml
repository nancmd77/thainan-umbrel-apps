releaseNotes: >-
  Versão 1.1.2: corrige EPP preso em performance. Com o governor em performance o processador ignora o EPP; ao mudar o EPP, o governor vai para powersave. Quando o governor é escolhido em performance, a página avisa que o EPP fica preso.
