id: thainan-economia
name: Economia
tagline: Nonve com CPU nos limites de fábrica, RTX ativa no barramento e turbo ativado
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-desempenho/icon.png
category: Developer
version: "1.1.0"
port: 8535
description: >-
  Painel de energia do Nonve (Acer Nitro, RTX 2050). Perfis com um clique (Economia, Equilíbrio, Desempenho e Fábrica) e controles individuais de CPU (PL1/PL2), turbo, RTX no barramento PCI, fans, EPP, governor e ASPM. Bateria travada em 80% quando o kernel suporta. Estado salvo em disco e reaplicado a cada 5 minutos e no boot. Painel na porta 8535, atrás do login do Umbrel.
developer: Thainan Caldeira
