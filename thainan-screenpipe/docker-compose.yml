version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-screenpipe_web_1
      APP_PORT: 8541
  web:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    restart: unless-stopped
    ports:
      - "8542:8542"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA: /data
      TZ: America/Sao_Paulo
    entrypoint: ["sh", "-c"]
    command:
      - |
        apk add --no-cache ffmpeg >/dev/null 2>&1
        until wget -q -O /tmp/sp.py https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-screenpipe/sp.py; do sleep 10; done
        exec python3 -u /tmp/sp.py
