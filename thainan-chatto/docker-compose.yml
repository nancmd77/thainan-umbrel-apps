version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-chatto_web_1
      APP_PORT: 4000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/chattocorp/chatto:latest@sha256:5990c82dbb6d6d8c9464dff9301060ea5a5253ccb26a39f0ad62bbe816df9bf0
    restart: on-failure
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        set -eu
        if [ ! -f /config/chatto.toml ]; then
          /chatto init -c /config/chatto.toml
        fi
        exec /usr/local/bin/docker-entrypoint.sh start -c /config/chatto.toml
    environment:
      PUID: "1000"
      PGID: "1000"
      CHATTO_NATS_EMBEDDED_ENABLED: "true"
      CHATTO_WEBSERVER_PORT: "4000"
      CHATTO_WEBSERVER_URL: "http://${DEVICE_DOMAIN_NAME}:4000"
      CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET: "${APP_THAINAN_CHATTO_CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET}"
      CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET: "${APP_THAINAN_CHATTO_CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET}"
      CHATTO_CORE_SECRET_KEY: "${APP_THAINAN_CHATTO_CHATTO_CORE_SECRET_KEY}"
      CHATTO_CORE_ASSETS_SIGNING_SECRET: "${APP_THAINAN_CHATTO_CHATTO_CORE_ASSETS_SIGNING_SECRET}"
      CHATTO_LIVEKIT_ENABLED: "false"
      CHATTO_SMTP_ENABLED: "false"
      CHATTO_LOG_LEVEL: info
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
