gallery: []
releaseNotes: >-
  Vídeos curtos (Reels/TikTok) agora em qualidade original/1080p; compressão só acima de 60 MB, sem baixar a resolução. Vídeos longos (YouTube) por padrão não sobem ao SilverBullet: a página traz capa, link e quadros. Configurações novas em seções, com validação, botões de teste, reprocessar e exportar/importar.

  Tela nova inspirada no Linkding: lista limpa com capa, título, gancho e tags clicáveis; busca no topo (título, resumo, tags e transcrição) com filtros de status e fonte; lateral com assuntos e nuvem de tags com contagem; campo "Adicionar link" no topo; ações por item (Abrir no SilverBullet, Reprocessar, Apagar). Tema claro/escuro automático ou escolhido nas configurações, e funciona no celular.
