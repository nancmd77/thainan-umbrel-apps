gallery: []
releaseNotes: >-
  Puxa TODOS os vídeos salvos do Instagram, não só os mais recentes. Roda sozinho uma vez depois da atualização e depois fica no botão em Configurações > Manutenção. Fotos e carrosséis ficam de fora, e o que você apagou da lista não volta.
