gallery: []
releaseNotes: >-
  A IA agora "assiste" o vídeo, não só ouve. O worker baixa o vídeo em 480p, tira até 60 frames (ajustável) com o claude-real-video e manda as folhas 3x3 pro Gemini junto com a transcrição com tempos. O resumo ganha "o que aparece": cronologia curta com mm:ss do que está na tela, texto escrito e ações, gravada no Karakeep e no Open Notebook. Se o modelo recusar imagem ou a extração falhar, segue só com a transcrição e a fila avisa "sem visão: motivo". O primeiro start instala o ffmpeg e demora alguns minutos.
