releaseNotes: >-
  SilverBullet: Excalidraw removido (o worker tira o bloco da index e do Video KB; Quadro.excalidraw não é apagado). Novo mural no topo da index: cada card mostra a capa e toca o vídeo ali mesmo, sem abrir o link original. Corrige sozinho as páginas já gravadas, sem IA.
