manifestVersion: 1
id: thainan-video-kb
name: Video KB Worker
tagline: Vídeos, páginas e PDFs viram resumo, tags e página no SilverBullet
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-video-kb/icon.png
category: AI
version: "1.10.0"
port: 8519
description: >-
  Cole um link na caixa do app ou ligue os coletores (YouTube, Instagram salvos, Reddit salvos, TikTok favoritos). Vídeo: o worker baixa (Cobalt, com yt-dlp de reserva), transcreve com ElevenLabs Scribe, vê os quadros e resume com Gemini pelo 9Router do Nonve. Página e PDF: o próprio worker lê o texto do link. Tudo vira página no SilverBullet (mural, assuntos, player) e, se ligado, fonte no Open Notebook.

  Karakeep é opcional: ligue em Configurações para usar bookmarks como entrada e gravar resumo, nota e tags lá.

  Depois de instalar, abra o app > Configurações e cole as chaves (ElevenLabs, 9Router, SilverBullet, Open Notebook). As chaves ficam só no volume do app.
developer: Thainan Caldeira
website: https://github.com/nancmd77/thainan-umbrel-apps
submitter: Thainan Caldeira
submission: https://github.com/nancmd77/thainan-umbrel-apps
repo: https://github.com/nancmd77/thainan-umbrel-apps
support: https://github.com/nancmd77/thainan-umbrel-apps/issues
gallery: []
releaseNotes: >-
  Instagram sem cookie: com usuário e senha (e a chave do autenticador, se usar 2FA), o Video KB entra sozinho, guarda a sessão e refaz o login quando ela cai, só pra ler os salvos. Com a chave da HikerAPI, legenda, números, capa e vídeo de cada Reel vêm por ela, sem usar a sua conta. Se o Instagram pedir código, o aviso aparece em Coletores. Cookies viram reserva.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
