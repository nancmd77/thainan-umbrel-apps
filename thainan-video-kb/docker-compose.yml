version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-video-kb_web_1
      APP_PORT: 8080
      PROXY_AUTH_WHITELIST: "/webhook/*"
  web:
    image: python:3.12-slim
    restart: on-failure
    working_dir: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
      REF: video-kb-v1.12.3
      SB_LOCAL: /data/cerebro
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
      CRV_NO_MEMORY: "1"
      CRV_NO_HINT: "1"
    volumes:
      - ${APP_DATA_DIR}/app:/app:ro
      - ${APP_DATA_DIR}/data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # código: sempre baixa main.py da tag REF (o Umbrel não atualiza a pasta app/ no update); sem rede, usa /app
        D=/data/app; mkdir -p $$D
        python -c "import urllib.request as u; u.urlretrieve('https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$$REF/thainan-video-kb/app/main.py', '$$D/main.py.new')" && mv $$D/main.py.new $$D/main.py || { [ -f $$D/main.py ] || D=/app; echo "download do código falhou, usando $$D"; }
        # ffmpeg/ffprobe (visão via crv); só instala se faltar no container
        command -v ffprobe >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; } || echo "sem ffmpeg: worker segue sem visão"
        # yt-dlp (fallback do Cobalt, YouTube) + gallery-dl (coletores) + claude-real-video (visão, revisado pelo Hark 16 out, hash fixo, sem deps), versões fixas, uma vez no volume
        [ -f /data/pylib/.v1.3 ] || { pip install -q --upgrade --target /data/pylib yt-dlp==2026.8.19 gallery-dl==1.32.16 Pillow==11.3.0 && echo "claude-real-video==0.10.7 --hash=sha256:44654741dd041c93e357331114e7f83e09af994c69016c0f1d632ed2bb0418c4" > /tmp/crv-req.txt && pip install -q --no-deps --require-hashes --target /data/pylib -r /tmp/crv-req.txt && touch /data/pylib/.v1.3; } || echo "pip falhou: só Cobalt, sem coletores nem visão"
        # pypdf: PDF lido direto, sem Karakeep (v1.8)
        [ -f /data/pylib/.pypdf ] || { pip install -q --target /data/pylib pypdf==6.21.1 && touch /data/pylib/.pypdf; } || echo "pip falhou: sem leitor de PDF"
        # instagrapi (v1.10): login próprio só pros salvos; pasta separada pra não trocar o Pillow do crv
        [ -f /data/iglib/.v3.1.0 ] || { pip install -q --target /data/iglib instagrapi==3.1.0 && touch /data/iglib/.v3.1.0; } || echo "pip falhou: sem login do Instagram (cookies seguem valendo)"
        PYTHONPATH=/data/pylib:/data/iglib exec python -u $$D/main.py
  searx:
    # busca própria pros links dos cards (v1.9): JSON ligado, sem limitador; só a rede interna do app usa
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    restart: on-failure
    user: "0:0"
    volumes:
      - ${APP_DATA_DIR}/searx:/etc/searxng
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /etc/searxng/settings.yml ] || printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\n  image_proxy: false\nsearch:\n  safe_search: 0\n  formats:\n    - html\n    - json\n' "$$(head -c 24 /dev/urandom | base64 | tr -dc a-zA-Z0-9)" > /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
