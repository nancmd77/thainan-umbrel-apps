version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-ezbookkeeping_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"
  web:
    image: mayswind/ezbookkeeping:latest@sha256:3ffc7b62ac20ccafa6c09c4cd69ba197e257c0dc0adaa0655a0532264c41f982
    restart: on-failure
    user: "1000:1000"
    environment:
      EBK_SERVER_HTTP_PORT: "8080"
      EBK_SECURITY_SECRET_KEY: "${APP_THAINAN_EZBOOKKEEPING_EBK_SECURITY_SECRET_KEY}"
      EBK_SERVER_DOMAIN: "${DEVICE_DOMAIN_NAME}"
      EBK_SERVER_ROOT_URL: "http://${DEVICE_DOMAIN_NAME}:8085/"
    volumes:
      - ${APP_DATA_DIR}/data/db:/ezbookkeeping/data
      - ${APP_DATA_DIR}/data/storage:/ezbookkeeping/storage
      - ${APP_DATA_DIR}/data/log:/ezbookkeeping/log
