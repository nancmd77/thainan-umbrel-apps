version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-9router_web_1
      APP_PORT: 20128
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/nancmd77/9router:0.5.112
    restart: on-failure
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      INITIAL_PASSWORD: "${APP_PASSWORD}"
      JWT_SECRET: "${APP_THAINAN_9ROUTER_JWT_SECRET}"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
