gallery: []
releaseNotes: >-
  Selah 0.5.0: tipografia nova. O texto e a interface usam a Departure Mono (pixel, retrô de computador) e os títulos usam a Selah Híbrida, a serifa com algumas letras pixeladas, também no itálico. A Lida virou uma lista vertical de linhas finas: segure pra concluir, toque pra ver o ritmo e o mês. No celular, nomes longos quebram em duas linhas em vez de cortar.
