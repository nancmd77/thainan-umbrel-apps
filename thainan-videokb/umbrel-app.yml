releaseNotes: >-
  Rolagem mais leve e estável: a busca do topo não faz mais a página pular, temas fora da tela não pesam e as pílulas de tema levam ao tema certo, com faixa de fundo própria.
  Papiro rola com a roda em qualquer ponto da tela e pelo teclado, o card inteiro abre a matéria e o Product Hunt passa a buscar a foto de todos os produtos.
  Card aberto ganhou botão de fechar; Esc fecha o Maná; o logo Selah volta pro Alforje.
