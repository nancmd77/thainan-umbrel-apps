description: >-
  Selah lê os reels que o Video KB guardou e mostra numa grade calma: vídeo tocando no próprio app,
  gancho, resumo, pontos-chave, linha do tempo que pula o vídeo, transcrição, etiquetas e notas. Temas Papel,
  Floresta e Akira. Privado, só seu.
