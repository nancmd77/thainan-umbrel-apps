version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-videokb_web_1
      APP_PORT: 8765
      PROXY_AUTH_ADD: "false"
  web:
    image: node:22-alpine
    restart: on-failure
    # Código: baixa o pacote da tag REF no GitHub a cada partida (o Umbrel não troca os arquivos do app no update); sem rede, usa o pacote local.
    command: ["sh", "-c", "rm -rf /tmp/app /tmp/pk && mkdir -p /tmp/app /tmp/pk && i=0; while wget -q -O /tmp/pk/app.tgz.part$$(printf %02d $$i) https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$$REF/thainan-videokb/app.tgz.part$$(printf %02d $$i); do i=$$((i+1)); done; rm -f /tmp/pk/app.tgz.part$$(printf %02d $$i); if [ $$i -gt 0 ] && cat /tmp/pk/app.tgz.part* | tar xz -C /tmp/app; then echo pacote $$REF; else rm -rf /tmp/app/* && cat /bundle/app.tgz.part* | tar xz -C /tmp/app && echo pacote local; fi && cd /tmp/app && exec node server.js"]
    environment:
      PORT: "8765"
      REF: selah-v0.3.1
      DATA_DIR: /tmp/app/dados
      STATE_DIR: /estado
      SB_DIR: /cerebro
    volumes:
      - ${APP_DATA_DIR}:/bundle:ro
      - ${APP_DATA_DIR}/estado:/estado
      - ${APP_DATA_DIR}/../thainan-video-kb/data/cerebro:/cerebro:ro
