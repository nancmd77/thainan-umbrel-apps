version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-videokb_web_1
      APP_PORT: 8765
      PROXY_AUTH_ADD: "false"
  web:
    image: node:22-alpine
    restart: on-failure
    # Código: baixa o pacote da tag REF no GitHub a cada partida (o Umbrel não troca o pacote no update); sem rede, usa o pacote local.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rm -rf /tmp/app && mkdir -p /tmp/app
        cat > /tmp/baixa.js <<'FIM'
        const R = process.env.REF, b = 'https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/' + R + '/thainan-videokb/app.tgz.part';
        (async () => {
          const partes = [];
          for (let i = 0; i < 30; i++) {
            const r = await fetch(b + String(i).padStart(2, '0'), { signal: AbortSignal.timeout(90000) });
            if (r.status === 404) break;
            if (!r.ok) throw new Error('HTTP ' + r.status);
            partes.push(Buffer.from(await r.arrayBuffer()));
          }
          if (!partes.length) throw new Error('nenhuma parte');
          require('fs').writeFileSync('/tmp/pacote.tgz', Buffer.concat(partes));
          console.log('pacote', R, partes.length, 'partes');
        })().catch((e) => { console.error('sem pacote do GitHub:', e.message); process.exit(1); });
        FIM
        # 0.6.7: no boot do Nonve a rede demora; tenta por até ~5 min antes de desistir
        ok=0
        for t in $$(seq 1 30); do
          if node /tmp/baixa.js && tar xzf /tmp/pacote.tgz -C /tmp/app; then ok=1; cp /tmp/pacote.tgz "/estado/pacote-$$REF.tgz.new" && mv "/estado/pacote-$$REF.tgz.new" "/estado/pacote-$$REF.tgz"; break; fi
          rm -rf /tmp/app && mkdir -p /tmp/app; echo "tentativa $$t sem rede, de novo em 10 s"; sleep 10
        done
        # sem rede: usa a última cópia boa desta versão; só em último caso o pacote antigo do bundle
        if [ "$$ok" = 0 ]; then
          if [ -f "/estado/pacote-$$REF.tgz" ] && tar xzf "/estado/pacote-$$REF.tgz" -C /tmp/app; then echo "usando a cópia salva de $$REF"
          else rm -rf /tmp/app && mkdir -p /tmp/app && cat /bundle/app.tgz.part* | tar xz -C /tmp/app && echo "usando o pacote local"; fi
        fi
        cd /tmp/app && exec node server.js
    environment:
      PORT: "8765"
      REF: selah-v0.7.1
      DATA_DIR: /tmp/app/dados
      STATE_DIR: /estado
      SB_DIR: /cerebro
      # Papiro: texto completo pelo leitor (Scrapling); filtro por interesse e resumo em pt pelo 9Router da config do Video KB (só leitura)
      LEITOR_URL: http://thainan-videokb_leitor_1:8790
      VKB_CONFIG: /vkb/config.json
    volumes:
      - ${APP_DATA_DIR}:/bundle:ro
      - ${APP_DATA_DIR}/estado:/estado
      - ${APP_DATA_DIR}/../thainan-video-kb/data/cerebro:/cerebro:ro
      - ${APP_DATA_DIR}/../thainan-video-kb/data/config.json:/vkb/config.json:ro
  leitor:
    # Papiro: lê as matérias do AlternativeTo com o Scrapling leve; feeds bloqueados (LTT) pelo navegador como último recurso; só a rede interna usa
    image: python:3.13-slim
    restart: on-failure
    environment:
      PORT: "8790"
      CEREBRO_DIR: /cerebro
      MINI_DIR: /leitor/mini
      REF: selah-v0.7.1
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
      PLAYWRIGHT_BROWSERS_PATH: /leitor/browsers
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ${APP_DATA_DIR}:/bundle:ro
      - ${APP_DATA_DIR}/leitor:/leitor
      # miniaturas das capas (webp 480 px) saem daqui, só leitura
      - ${APP_DATA_DIR}/../thainan-video-kb/data/cerebro:/cerebro:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # código: baixa leitor.py da tag REF (o Umbrel não troca a pasta do app no update); sem rede, usa a cópia local
        ok=0
        for t in $$(seq 1 30); do
          python -c "import urllib.request as u; u.urlretrieve('https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$$REF/thainan-videokb/leitor.py', '/leitor/leitor.py.new')" 2>/dev/null && mv /leitor/leitor.py.new /leitor/leitor.py && ok=1 && break
          echo "leitor: tentativa $$t sem rede, de novo em 10 s"; sleep 10
        done
        [ "$$ok" = 1 ] || { [ -f /leitor/leitor.py ] || cp /bundle/leitor.py /leitor/leitor.py; echo "download do leitor falhou, usando a cópia local"; }
        # Scrapling e dependências em versões fixas, instalados uma vez no volume
        [ -f /leitor/pylib/.v0.5 ] || { pip install -q --target /leitor/pylib scrapling==0.5 curl_cffi==0.16.3 patchright==1.64.2 browserforge==1.2.4 && touch /leitor/pylib/.v0.5; }
        # Pillow pras miniaturas das capas (0.6.2)
        [ -f /leitor/pylib/.pil12 ] || { pip install -q --target /leitor/pylib pillow==12.3.0 && touch /leitor/pylib/.pil12; }
        # 0.7: navegador (Chromium do patchright) pro feed da LTT (Cloudflare "managed"). Instala em 2º plano e sem travar:
        # se falhar, só a LTT fica de fora e o resto do leitor segue normal. Libs do Python e navegador ficam no volume;
        # as libs do sistema (apt) voltam a ser instaladas só quando o container é recriado.
        # as pastas precisam existir antes do python subir (pasta ausente no PYTHONPATH fica ignorada até reiniciar)
        mkdir -p /leitor/pynav /leitor/browsers
        (
          [ -f /leitor/pynav/.v07 ] || { pip install -q --target /leitor/pynav playwright==1.64.1 apify-fingerprint-datapoints==0.15.0 msgspec==0.22.0 anyio==4.15.1 protego==0.7.0 click==8.5.0 && touch /leitor/pynav/.v07; } &&
          { [ -f /opt/.navdeps ] || { PYTHONPATH=/leitor/pylib:/leitor/pynav python -m patchright install-deps chromium >/tmp/navdeps.log 2>&1 && touch /opt/.navdeps; }; } &&
          { [ -f /leitor/browsers/.v07 ] || { PYTHONPATH=/leitor/pylib:/leitor/pynav python -m patchright install chromium >/tmp/navbin.log 2>&1 && touch /leitor/browsers/.v07; }; } &&
          echo "leitor: navegador pronto" || echo "leitor: navegador indisponível, a LTT fica de fora (resto normal)"
        ) &
        PYTHONPATH=/leitor/pylib:/leitor/pynav exec python -u /leitor/leitor.py
