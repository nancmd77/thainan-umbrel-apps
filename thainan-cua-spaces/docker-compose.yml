version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thainan-cua-spaces_info_1
      APP_PORT: 8626

  init:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    network_mode: none
    environment:
      TOKEN: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - sh
      - -c
      - |
        mkdir -p /data/www /data/chromium /data/mcp
        chown 1000:1000 /data/mcp
        # Perfil do Chromium persistente (r2): dono = usuário cua da imagem (uid/gid 1000).
        chown 1000:1000 /data/chromium
        chmod 700 /data/chromium
        # Travas de uma execução anterior impedem o Chromium de abrir depois de um reinício.
        rm -f /data/chromium/SingletonLock /data/chromium/SingletonSocket /data/chromium/SingletonCookie
        # Sessão só de navegador: substitui o startxfce4 da imagem (sem painel, sem área de trabalho, sem terminal).
        # Fica o xfwm4 (foco e maximizar) e o Chromium maximizado, que reabre se fechar.
        cat > /data/sessao.sh <<'SH'
        #!/bin/sh
        xset s off -dpms 2>/dev/null
        xsetroot -solid black 2>/dev/null
        ( while :; do xfwm4 --compositor=off --sm-client-disable; sleep 1; done ) &
        sleep 1
        P="$$HOME/.config/chromium"
        while :; do
          # Só limpa as travas e o aviso de "fechou inesperadamente" se nenhum Chromium estiver rodando.
          if ! pgrep -u "$$(id -u)" -x chromium >/dev/null 2>&1; then
            rm -f "$$P/SingletonLock" "$$P/SingletonSocket" "$$P/SingletonCookie"
            [ -f "$$P/Default/Preferences" ] && sed -i 's/"exit_type":"Crashed"/"exit_type":"Normal"/; s/"exited_cleanly":false/"exited_cleanly":true/' "$$P/Default/Preferences"
          fi
          /usr/bin/chromium --start-maximized --no-first-run --no-default-browser-check --lang=pt-BR --restore-last-session
          sleep 1
        done
        SH
        chmod 755 /data/sessao.sh
        cat > /data/www/index.html <<HTML
        <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Cua Spaces</title>
        <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;line-height:1.5}code{background:#eee;padding:2px 6px;user-select:all;word-break:break-all}</style></head><body>
        <h1>Cua Spaces no Nonve</h1>
        <p>No app Cua Spaces (Windows ou Mac): New Space, depois Connect by address.</p>
        <p>Endereço: <code>192.168.18.171:3211</code></p>
        <p>Token: <code>$$TOKEN</code></p>
        <p>Só funciona dentro da rede de casa. Pelo terminal: <code>cua spaces add 192.168.18.171:3211 --token SEU_TOKEN --name nonve</code></p>
        </body></html>
        HTML
        chmod 644 /data/www/index.html
        # Ponte MCP (r4): o Umbrel não copia arquivos extras da pasta do app, então o script vai aqui.
        cat > /data/ponte-mcp.py <<'PY'
        #!/usr/bin/env python3
        # Ponte MCP do Cua Spaces (thainan-cua-spaces r3).
        # Roda o MCP oficial do cua (`cua mcp`, stdio) e o expõe como Streamable HTTP
        # (respostas em JSON, sem SSE) em POST /mcp. Uma sessão MCP = um processo `cua mcp`.
        # Só na rede interna do Docker do Umbrel (porta sem publicação), sem bearer.
        # Só biblioteca padrão do Python, nada baixado.
        import json, os, queue, subprocess, sys, threading, time, uuid
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        CUA = os.environ.get("CUA_BIN", "/usr/local/bin/cua")
        SPACE_URL = os.environ.get("PONTE_SPACE_URL", "http://thainan-cua-spaces_space_1:3211")
        PORT = int(os.environ.get("PONTE_PORT", "8627"))
        PERMS = os.environ.get("PONTE_PERMISSIONS", "computer:all")
        TIMEOUT = float(os.environ.get("PONTE_TIMEOUT", "300"))
        IDLE = float(os.environ.get("PONTE_IDLE", "1800"))
        MAX_SESSIONS = int(os.environ.get("PONTE_MAX_SESSIONS", "8"))


        def log(*a):
            print(time.strftime("%H:%M:%S"), *a, file=sys.stderr, flush=True)


        def register_space():
            """Registra o Space em modo direto (token em CUA_ENV_TOKEN) e devolve o nome do alvo."""
            for tentativa in range(60):
                r = subprocess.run([CUA, "do", "--embedded", "switch", "url", SPACE_URL],
                                   capture_output=True, text=True)
                if r.returncode == 0:
                    with open(os.path.expanduser("~/.cua/do_target.json")) as f:
                        name = json.load(f)["name"]
                    log("Space registrado:", name)
                    return name
                log("Space ainda não respondeu, tentando de novo:", (r.stderr or r.stdout).strip()[-200:])
                time.sleep(5)
            sys.exit("Space não respondeu")


        SANDBOX = None


        class Session:
            def __init__(self):
                self.id = uuid.uuid4().hex
                self.proc = subprocess.Popen(
                    [CUA, "mcp", "--embedded", "--sandbox", SANDBOX, "--permissions", PERMS],
                    stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, bufsize=1)
                self.wlock = threading.Lock()
                self.pending = {}
                self.plock = threading.Lock()
                self.last = time.time()
                threading.Thread(target=self.reader, daemon=True).start()

            def send(self, msg):
                with self.wlock:
                    self.proc.stdin.write(json.dumps(msg) + "\n")
                    self.proc.stdin.flush()

            def reader(self):
                for line in self.proc.stdout:
                    line = line.strip()
                    if not line:
                        continue
                    try:
                        msg = json.loads(line)
                    except ValueError:
                        continue
                    if "method" in msg and "id" in msg:
                        # pedido do servidor ao cliente (ping, roots...): responde aqui
                        if msg["method"] == "ping":
                            self.send({"jsonrpc": "2.0", "id": msg["id"], "result": {}})
                        else:
                            self.send({"jsonrpc": "2.0", "id": msg["id"],
                                       "error": {"code": -32601, "message": "não suportado pela ponte"}})
                        continue
                    if "id" in msg:
                        key = json.dumps(msg["id"])
                        with self.plock:
                            q = self.pending.pop(key, None)
                        if q:
                            q.put(msg)
                with self.plock:
                    for q in self.pending.values():
                        q.put(None)
                    self.pending.clear()

            def request(self, msg):
                q = queue.Queue(1)
                with self.plock:
                    self.pending[json.dumps(msg["id"])] = q
                self.send(msg)
                try:
                    r = q.get(timeout=TIMEOUT)
                except queue.Empty:
                    r = None
                if r is None:
                    r = {"jsonrpc": "2.0", "id": msg["id"],
                         "error": {"code": -32000, "message": "sem resposta do cua mcp"}}
                self.last = time.time()
                return r

            def close(self):
                try:
                    self.proc.kill()
                except Exception:
                    pass


        SESSIONS = {}
        SLOCK = threading.Lock()


        def reaper():
            while True:
                time.sleep(60)
                now = time.time()
                with SLOCK:
                    for sid, s in list(SESSIONS.items()):
                        if now - s.last > IDLE or s.proc.poll() is not None:
                            s.close()
                            del SESSIONS[sid]
                            log("sessão encerrada:", sid[:8])


        class H(BaseHTTPRequestHandler):
            protocol_version = "HTTP/1.1"

            def log_message(self, *a):
                pass

            def reply(self, code, body=None, sid=None):
                data = b"" if body is None else json.dumps(body).encode()
                self.send_response(code)
                if body is not None:
                    self.send_header("Content-Type", "application/json")
                if sid:
                    self.send_header("Mcp-Session-Id", sid)
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)

            def do_GET(self):
                if self.path.startswith("/healthz"):
                    return self.reply(200, {"ok": True, "sessoes": len(SESSIONS), "space": SANDBOX})
                self.send_response(405)
                self.send_header("Allow", "POST, DELETE")
                self.send_header("Content-Length", "0")
                self.end_headers()

            def do_DELETE(self):
                sid = self.headers.get("Mcp-Session-Id")
                with SLOCK:
                    s = SESSIONS.pop(sid, None)
                if s:
                    s.close()
                self.reply(200 if s else 404)

            def do_POST(self):
                if not self.path.startswith("/mcp"):
                    return self.reply(404, {"error": "use /mcp"})
                try:
                    n = int(self.headers.get("Content-Length") or 0)
                    payload = json.loads(self.rfile.read(n) or b"null")
                except ValueError:
                    return self.reply(400, {"jsonrpc": "2.0", "id": None,
                                            "error": {"code": -32700, "message": "JSON inválido"}})
                msgs = payload if isinstance(payload, list) else [payload]
                sid = self.headers.get("Mcp-Session-Id")
                is_init = any(isinstance(m, dict) and m.get("method") == "initialize" for m in msgs)
                if is_init:
                    with SLOCK:
                        if len(SESSIONS) >= MAX_SESSIONS:
                            old = min(SESSIONS.values(), key=lambda x: x.last)
                            old.close()
                            SESSIONS.pop(old.id, None)
                        s = Session()
                        SESSIONS[s.id] = s
                    sid = s.id
                    log("sessão nova:", sid[:8])
                else:
                    with SLOCK:
                        s = SESSIONS.get(sid)
                    if not s:
                        return self.reply(404, {"jsonrpc": "2.0", "id": None,
                                                "error": {"code": -32001, "message": "sessão desconhecida"}})
                s.last = time.time()
                out = []
                for m in msgs:
                    if isinstance(m, dict) and "method" in m and "id" in m:
                        out.append(s.request(m))
                    else:
                        s.send(m)
                if not out:
                    return self.reply(202, None, sid)
                self.reply(200, out if isinstance(payload, list) else out[0], sid)


        if __name__ == "__main__":
            SANDBOX = register_space()
            threading.Thread(target=reaper, daemon=True).start()
            srv = ThreadingHTTPServer(("0.0.0.0", PORT), H)
            srv.daemon_threads = True
            log(f"ponte MCP em :{PORT}/mcp -> cua mcp --sandbox {SANDBOX} --permissions {PERMS}")
            srv.serve_forever()
        PY
        chmod 644 /data/ponte-mcp.py
        echo 'init: ok'

  space:
    image: ghcr.io/trycua/linux:24.04-slim@sha256:d21a48ebbfe03914fdfc109c21780a8bd75cb1ec15cc83ad956fa2ecafb4b8aa
    restart: on-failure
    stop_grace_period: 15s
    shm_size: 1g
    mem_limit: 3g
    hostname: nonve-space
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      CUA_ENV_TOKEN: "${APP_PASSWORD}"
      CUA_RESOLUTION: "1920x1080"
      TZ: America/Sao_Paulo
      DO_NOT_TRACK: "1"
      CUA_TELEMETRY: "0"
    ports:
      - "192.168.18.171:3211:3211/tcp"
      - "192.168.18.171:3212:3212/udp"
    volumes:
      - ${APP_DATA_DIR}/data/sessao.sh:/usr/bin/startxfce4:ro
      - ${APP_DATA_DIR}/data/chromium:/home/cua/.config/chromium

  # Ponte MCP (r3/r4): MCP oficial do cua (`cua mcp`, stdio, modo direto no Space com o token)
  # exposto como Streamable HTTP em http://thainan-cua-spaces_mcp_1:8627/mcp.
  # Sem porta publicada: só a rede interna do Docker do Umbrel (ex. o Langflow) alcança. Sem bearer.
  mcp:
    image: ghcr.io/trycua/linux:24.04-slim@sha256:d21a48ebbfe03914fdfc109c21780a8bd75cb1ec15cc83ad956fa2ecafb4b8aa
    restart: on-failure
    user: "1000:1000"
    mem_limit: 512m
    depends_on:
      space:
        condition: service_started
    entrypoint: ["python3", "-u", "/data/ponte-mcp.py"]
    command: []
    environment:
      HOME: /data/mcp
      CUA_ENV_TOKEN: "${APP_PASSWORD}"
      PONTE_SPACE_URL: "http://thainan-cua-spaces_space_1:3211"
      PONTE_PORT: "8627"
      PONTE_PERMISSIONS: "computer:all"
      DO_NOT_TRACK: "1"
      CUA_TELEMETRY: "0"
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/mcp:/data/mcp
      - ${APP_DATA_DIR}/data/ponte-mcp.py:/data/ponte-mcp.py:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8627/healthz',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  info:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/www:/www:ro
    command: ["httpd", "-f", "-p", "8626", "-h", "/www"]
