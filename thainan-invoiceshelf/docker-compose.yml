version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-invoiceshelf_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"
  web:
    image: invoiceshelf/invoiceshelf:latest
    restart: on-failure
    environment:
      APP_NAME: InvoiceShelf
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://${DEVICE_DOMAIN_NAME}:8090"
      SESSION_DOMAIN: "${DEVICE_DOMAIN_NAME}"
      SANCTUM_STATEFUL_DOMAINS: "${DEVICE_DOMAIN_NAME}:8090"
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_LIFETIME: "240"
      AUTORUN_ENABLED: "true"
      PHP_OPCACHE_ENABLE: "1"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/www/html/storage
      - ${APP_DATA_DIR}/data/modules:/var/www/html/Modules
