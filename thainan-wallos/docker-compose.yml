version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-wallos_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: bellamy/wallos:latest
    restart: on-failure
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/www/html/db
      - ${APP_DATA_DIR}/data/logos:/var/www/html/images/uploads/logos
