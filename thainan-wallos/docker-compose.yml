version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-wallos_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: bellamy/wallos:latest@sha256:78b73a32ae24bcca67d6f4b96ca76fe29ee8da5e8df1769df1e612a4e776c904
    restart: on-failure
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/www/html/db
      - ${APP_DATA_DIR}/data/logos:/var/www/html/images/uploads/logos
