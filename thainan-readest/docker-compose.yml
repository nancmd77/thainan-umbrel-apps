version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thainan-readest_gateway_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  gateway:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - kong
      - minio

  db:
    image: supabase/postgres:15.8.1.085
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ${APP_DATA_DIR}/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ${APP_DATA_DIR}/volumes/db/init/schema.sql:/docker-entrypoint-initdb.d/init-scripts/100-schema.sql:ro
      - ${APP_DATA_DIR}/volumes/db/migrations:/readest-migrations:ro
      - ${APP_DATA_DIR}/volumes/db/apply-migrations.sh:/docker-entrypoint-initdb.d/zz-readest-migrations.sh:ro
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/data/postgres-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: "rdst2381c4f73b7508a383bc79d19bc9"
      POSTGRES_PASSWORD: "rdst2381c4f73b7508a383bc79d19bc9"
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: "thainan-readest-85bfe4df8a7aa395bf3f3824cd55c1791ec57209cff7ad4dfcdbb8b789f35ceb"
      JWT_EXP: "3600"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  kong:
    image: kong:2.8.1
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/volumes/api/kong.yml:/home/kong/temp.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.WPO1W3g4Aa2O8ZCfAzOMhOWUe78adfuEQ3ZNnJibypc"
      SUPABASE_SERVICE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UifQ.Q3W6bC7_e2UMvCZMa0Kb09_zTknvdCN6vWjwqDxFYqg"
    entrypoint:
      - bash
      - -c
      - eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start

  auth:
    image: supabase/gotrue:v2.185.0
    restart: on-failure
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: "http://${DEVICE_DOMAIN_NAME}:3050"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:rdst2381c4f73b7508a383bc79d19bc9@db:5432/postgres"
      GOTRUE_SITE_URL: "http://${DEVICE_DOMAIN_NAME}:3050"
      GOTRUE_URI_ALLOW_LIST: "http://${DEVICE_DOMAIN_NAME}:3050/**"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: "thainan-readest-85bfe4df8a7aa395bf3f3824cd55c1791ec57209cff7ad4dfcdbb8b789f35ceb"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v14.3
    restart: on-failure
    environment:
      PGRST_DB_URI: "postgres://authenticator:rdst2381c4f73b7508a383bc79d19bc9@db:5432/postgres"
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "thainan-readest-85bfe4df8a7aa395bf3f3824cd55c1791ec57209cff7ad4dfcdbb8b789f35ceb"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: "thainan-readest-85bfe4df8a7aa395bf3f3824cd55c1791ec57209cff7ad4dfcdbb8b789f35ceb"
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    command: ["postgrest"]

  minio:
    image: quay.io/minio/minio:latest
    restart: on-failure
    environment:
      MINIO_ROOT_USER: readest
      MINIO_ROOT_PASSWORD: "rdst496bc16cf5d667db2e1c6c8040ab"
    command: server --console-address ":9001" /data
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-setup:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set myminio http://minio:9000 readest rdst496bc16cf5d667db2e1c6c8040ab && mc mb --ignore-existing myminio/readest-files

  client:
    image: ghcr.io/readest/readest:latest
    restart: on-failure
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: "http://${DEVICE_DOMAIN_NAME}:3050"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.WPO1W3g4Aa2O8ZCfAzOMhOWUe78adfuEQ3ZNnJibypc"
      SUPABASE_ADMIN_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UifQ.Q3W6bC7_e2UMvCZMa0Kb09_zTknvdCN6vWjwqDxFYqg"
      API_BASE_URL: "http://${DEVICE_DOMAIN_NAME}:3050"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: "http://${DEVICE_DOMAIN_NAME}:3050"
      S3_REGION: us-east-1
      S3_BUCKET_NAME: readest-files
      S3_ACCESS_KEY_ID: readest
      S3_SECRET_ACCESS_KEY: "rdst496bc16cf5d667db2e1c6c8040ab"
      OBJECT_STORAGE_TYPE: s3
      SELF_HOSTED: "true"
      STORAGE_FIXED_QUOTA: "1073741824"
      TRANSLATION_FIXED_QUOTA: "50000"
    depends_on:
      - kong
      - minio
