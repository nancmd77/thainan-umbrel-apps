description: >-
  Roda o Orca (IDE de agentes da Stably AI) no modo Remote Orca Server, com `orca-ide serve` sem tela. Os projetos, worktrees, terminais e agentes ficam no Nonve e seguem rodando com o PC desligado; o Orca do computador e o Orca Mobile só mostram a interface.

  A página deste app gera os links de pareamento (rede de casa 192.168.18.171 ou Tailscale nonve.taila412b1.ts.net), para colar em Settings, Remote Orca Servers, Add Server, ou no Pair do celular. A porta 6768 fica aberta na LAN e no Tailscale; não publique na internet.

  Vem com Claude Code, Codex, OpenCode e Antigravity (agy). O login de cada um é feito num terminal do Orca conectado aqui. O servidor do Orca é atualizado sozinho a cada reinício.
