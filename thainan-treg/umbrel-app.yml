description: >-
  treg (tools-registry, Superdesign) guarda as chaves de API cifradas no servidor e repassa as chamadas dos agentes injetando a credencial: o agente só tem um token do treg e nunca vê a chave.

  Uso local no Nonve: o Langflow chama http://thainan-treg_web_1:18790 pela rede interna; na LAN o painel fica em http://nonve.local:8640/app. Sem chaves de plataforma do treg.to, então nenhuma chamada do catálogo é paga: só passam as suas chaves e as rotas públicas grátis.

  Entrar no painel: e-mail do nan (thainancaldeira75@gmail.com) e, no campo do código, a senha deste app no Umbrel (código fixo; nenhum e-mail é enviado).
