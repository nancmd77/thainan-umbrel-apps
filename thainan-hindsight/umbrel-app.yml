description: >-
  Hindsight is a self-hosted agent memory system (API on 8888, UI on 9999).

  Set HINDSIGHT_API_LLM_API_KEY to your OpenAI-compatible API key (or point HINDSIGHT_API_LLM_BASE_URL at a local LLM). Without an LLM key, memory features will not work.

  Umbrel opens the control-plane UI (port 9999).
