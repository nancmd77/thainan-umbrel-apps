  fast-agent em modo servidor MCP. Cada especialista é um arquivo em /data/agents (modelo, instruções, MCPs, skills) e vira uma ferramenta MCP com o nome dele. Qualquer chat com MCP (OpenCode, Claude Code, Hermes, n8n) terceiriza chamando essa ferramenta, inclusive várias ao mesmo tempo.

