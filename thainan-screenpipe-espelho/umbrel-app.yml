manifestVersion: 1
id: thainan-screenpipe-espelho
name: Screenpipe Espelho
tagline: Cópia viva, só leitura, do Screenpipe do notebook de trabalho
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-screenpipe-espelho/icon.png
category: Files
version: "0.2.4"
port: 8632
description: >-
  Recebe a replicação contínua (Litestream, WebDAV) do banco do Screenpipe do notebook de trabalho e mantém uma cópia viva só leitura em data/replica/db.sqlite.

  Entrada WebDAV com usuário e senha na porta 8631 (publicada pelo Cloudflare Tunnel). O notebook manda as páginas do banco que mudaram e, à parte, os vídeos e imagens da pasta data (pasta midia).

  A tela do app é uma linha do tempo só leitura: navegar pelo dia, ver cada tela capturada, o texto lido e o áudio transcrito, e buscar em tudo. A senha vem do env SP_WEBDAV_PASS (definida nas configurações do app; padrão derivado do APP_SEED).
developer: Thainan Caldeira
website: https://github.com/nancmd77/thainan-umbrel-apps
submitter: Thainan Caldeira
submission: https://github.com/nancmd77/thainan-umbrel-apps
repo: https://github.com/benbjohnson/litestream
support: https://github.com/nancmd77/thainan-umbrel-apps/issues
gallery: []
releaseNotes: >-
  0.2.4: juntar remonta os arquivos em disco e o seguidor lê direto do disco (sem limite de 30 s).
  0.2.3: texto do banco chega em pedaços de 90 MB (rclone chunker) e o serviço juntar entrega o arquivo inteiro ao seguidor.
  0.2.2: Moondream removido a pedido do nan; nenhuma tela sai do Nonve.

  0.2.1: código da linha do tempo baixado por tag na partida (corrige atualização sem os arquivos).

  0.2.0: linha do tempo (tela, texto, áudio e busca), perguntar e descrever a tela com Moondream (nuvem, pelo LiteLLM interno; chave em SP_MOONDREAM_KEY), lê a réplica e a pasta midia sem escrever.

  0.1.0: entrada WebDAV (rclone 1.76.0) e seguidor Litestream 0.5.18 (restore -f, 1 s).
dependencies: []
path: ""
defaultUsername: ""
deterministicPassword: true
