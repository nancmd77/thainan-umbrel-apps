version: "3.7"

# Espelho do Screenpipe do notebook de trabalho.
# notebook: litestream replicate (db.sqlite do Screenpipe) -> webdavs://<host>/screenpipe (Cloudflare Tunnel -> 192.168.18.171:8631)
# notebook (vídeos): rclone copy da pasta data do Screenpipe -> webdavs://<host>/midia
# Nonve: webdav guarda as réplicas em data/webdav; seguidor faz litestream restore -f para data/replica/db.sqlite (só leitura).

services:
  app_proxy:
    environment:
      APP_HOST: thainan-screenpipe-espelho_linha_1
      APP_PORT: 8090
      PROXY_AUTH_ADD: "true"

  webdav:
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SP_WEBDAV_PASS: ${APP_THAINAN_SP_ESPELHO_PASS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec rclone serve webdav /data --addr :8080 --user notebook --pass "$$SP_WEBDAV_PASS" --dir-cache-time 1s --log-level NOTICE
    ports:
      - "8631:8080"
    volumes:
      - ${APP_DATA_DIR}/data/webdav:/data

  juntar:
    # junta os pedaços (rclone chunker, 90 MB) que o notebook manda pelo Cloudflare, para o seguidor ler o arquivo inteiro
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/screenpipe-c /data/screenpipe-j
        while true; do
          rclone sync ":chunker,remote=/data/screenpipe-c,chunk_size=90M:" /data/screenpipe-j --exclude "*.tmp" --log-level ERROR
          sleep 2
        done
    volumes:
      - ${APP_DATA_DIR}/data/webdav:/data

  seguidor:
    image: litestream/litestream:0.5.18@sha256:513bff62a88fc0c86c73d27333c41c54c89fe890a7c32a551600adff9309b11b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SP_WEBDAV_PASS: ${APP_THAINAN_SP_ESPELHO_PASS}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/ls.yml <<'YML'
        dbs:
          - path: /replica/db.sqlite
            replica:
              type: file
              path: /webdav/screenpipe-j/screenpipe
        YML
        while true; do
          rm -f /replica/db.sqlite /replica/db.sqlite-wal /replica/db.sqlite-shm
          echo "seguidor: tentando restore -f $$(date)"
          litestream restore -f -follow-interval 1s -config /tmp/ls.yml /replica/db.sqlite
          echo "seguidor: saiu ($$?), nova tentativa em 20 s"
          sleep 20
        done
    volumes:
      - ${APP_DATA_DIR}/data/replica:/replica
      - ${APP_DATA_DIR}/data/webdav:/webdav:ro
    depends_on:
      - webdav
      - juntar

  linha:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    restart: unless-stopped
    environment:
      SP_DB: /replica/db.sqlite
      SP_MIDIA: /webdav/midia
      SP_CACHE: /cache
      PORT: "8090"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /webdav/midia && chown 1000:1000 /webdav/midia
        apk add --no-cache ffmpeg >/dev/null 2>&1 || echo "linha: sem ffmpeg (só imagens jpg)"
        # código versionado por tag (o Umbrel não recopia data/ nas atualizações)
        BASE=https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/thainan-screenpipe-espelho-linha-v2/thainan-screenpipe-espelho/data/linha
        mkdir -p /app && for f in servidor.py index.html; do
          wget -qO /app/$$f.novo $$BASE/$$f && mv /app/$$f.novo /app/$$f || cp /linha/$$f /app/$$f 2>/dev/null || true
          [ -s /app/$$f ] && cp /app/$$f /linha-copia/$$f 2>/dev/null || true
        done
        [ -s /app/servidor.py ] || cp /linha-copia/servidor.py /linha-copia/index.html /app/ 2>/dev/null
        exec python3 -u /app/servidor.py
    volumes:
      - ${APP_DATA_DIR}/data/linha:/linha-copia
      - ${APP_DATA_DIR}/data/replica:/replica:ro
      - ${APP_DATA_DIR}/data/webdav:/webdav
      - ${APP_DATA_DIR}/data/cache:/cache
    depends_on:
      - seguidor

  consulta:
    # API oficial do Screenpipe (CLI 0.4.58, sem captura) lendo uma CÓPIA do banco; a réplica viva nunca é tocada.
    # Sem porta publicada: acesso só por dentro do Nonve. Chave = senha do espelho (Bearer).
    image: debian:trixie-slim
    restart: unless-stopped
    environment:
      SCREENPIPE_API_KEY: ${APP_THAINAN_SP_ESPELHO_PASS}
      SP_REFRESH_MIN: "30"
      HOME: /consulta/home
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        export DEBIAN_FRONTEND=noninteractive
        if [ ! -x /consulta/bin/screenpipe ]; then
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl python3 libgbm1 libwayland-client0 libxcb1 libpipewire-0.3-0t64 libopenblas0 liblzma5 libdbus-1-3 libpulse0 libssl3t64 >/dev/null
          mkdir -p /consulta/bin && curl -sL https://github.com/screenpipe/screenpipe/releases/download/cli-latest/screenpipe-0.4.58-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /consulta --strip-components=0
        else
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates python3 libgbm1 libwayland-client0 libxcb1 libpipewire-0.3-0t64 libopenblas0 liblzma5 libdbus-1-3 libpulse0 libssl3t64 >/dev/null
        fi
        DD=/consulta/home/.screenpipe
        mkdir -p $$DD /consulta/snap
        [ -e $$DD/data ] || ln -s /webdav/midia $$DD/data
        snap() {
          python3 - <<'PY'
        import sqlite3, os, sys, time
        src = sqlite3.connect('file:/replica/db.sqlite?mode=ro', uri=True, timeout=60)
        tmp = '/consulta/snap/db.sqlite.tmp'
        for f in (tmp, tmp + '-wal', tmp + '-shm'):
            if os.path.exists(f): os.remove(f)
        dst = sqlite3.connect(tmp)
        t = time.time(); src.backup(dst, pages=20000, sleep=0.05); src.close()
        ok = dst.execute('PRAGMA quick_check').fetchone()[0]
        dst.close()
        print('consulta: snapshot', round(time.time() - t), 's, quick_check', ok, flush=True)
        sys.exit(0 if ok == 'ok' else 1)
        PY
        }
        PID=""
        while true; do
          if snap; then
            [ -n "$$PID" ] && kill $$PID 2>/dev/null && wait $$PID 2>/dev/null
            rm -f $$DD/db.sqlite $$DD/db.sqlite-wal $$DD/db.sqlite-shm
            mv /consulta/snap/db.sqlite.tmp $$DD/db.sqlite
            echo "consulta: subindo screenpipe $$(date)"
            /consulta/bin/screenpipe record --data-dir $$DD --port 3030 --listen-on-lan --disable-vision --disable-audio --disable-telemetry >> /consulta/screenpipe.log 2>&1 &
            PID=$$!
          else
            echo "consulta: snapshot falhou, mantendo a cópia anterior"
          fi
          sleep $$(( SP_REFRESH_MIN * 60 ))
        done
    volumes:
      - ${APP_DATA_DIR}/data/consulta:/consulta
      - ${APP_DATA_DIR}/data/replica:/replica
      - ${APP_DATA_DIR}/data/webdav:/webdav:ro
    depends_on:
      - seguidor
