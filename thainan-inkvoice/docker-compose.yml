version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:6ba4658874f149460a02d629308ccdac011e33169492153e3a401ac9456cdef7
    restart: on-failure
    environment:
      JWT_SECRET: "${APP_THAINAN_INKVOICE_JWT_SECRET}"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
