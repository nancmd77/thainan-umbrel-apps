version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:054f9cc69796c3f0b1717357b53dbb7ce958a4dd1b584d5003c7896d416f4d45
    restart: on-failure
    environment:
      JWT_SECRET: "REMOVIDO-SEGREDO"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
