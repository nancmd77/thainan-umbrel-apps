version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:71b950bddb439e931ab0c738e4d209d8c4fe29339697631f7a93094fd9553cc3
    restart: on-failure
    environment:
      JWT_SECRET: "${APP_THAINAN_INKVOICE_JWT_SECRET}"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
