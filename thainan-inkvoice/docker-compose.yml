version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:ca9b367b5c23c0d01d2db0f4be9ade0659cde0099c840ad5058f3d25449ad5df
    restart: on-failure
    environment:
      JWT_SECRET: "${APP_THAINAN_INKVOICE_JWT_SECRET}"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
