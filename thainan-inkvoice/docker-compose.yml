version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:8d784561c2da2e468c4f3f9f9e87bf9d8ef412be5797f4763c9d0efdab487273
    restart: on-failure
    environment:
      JWT_SECRET: "${APP_THAINAN_INKVOICE_JWT_SECRET}"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
