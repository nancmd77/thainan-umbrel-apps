version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-inkvoice_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/pigontech/inkvoice:latest@sha256:b357b0dc7625be6b67cb739c58be581b0d3769d23cf747b8196308e0966fcf49
    restart: on-failure
    environment:
      JWT_SECRET: "${APP_THAINAN_INKVOICE_JWT_SECRET}"
      DATABASE_PATH: /app/data/invoice.db
      PORT: "3000"
      HOST: "0.0.0.0"
      COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
