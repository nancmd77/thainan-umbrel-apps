version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-sparkyfitness_frontend_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: "d2019347e903e4ef"
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
  server:
    image: codewithcj/sparkyfitness_server:latest
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPARKY_FITNESS_DB_HOST: thainan-sparkyfitness_db_1
      SPARKY_FITNESS_DB_PORT: "5432"
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: "d2019347e903e4ef"
      SPARKY_FITNESS_FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:3004"
      SPARKY_FITNESS_API_ENCRYPTION_KEY: "b3f325050e3759362d91062965760e706d9321ae2a21144eb78e537e024036fd"
      BETTER_AUTH_SECRET: "5feacaa2ecb9c7b5331c088ca5f15f95ab82bebbcaaf8b700f6a7f2cbcb59f39"
      NODE_ENV: production
      SPARKY_FITNESS_SERVER_PORT: "3010"
      ALLOW_PRIVATE_NETWORK_CORS: "true"
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/app/SparkyFitnessServer/uploads
      - ${APP_DATA_DIR}/data/backup:/app/SparkyFitnessServer/backup
  frontend:
    image: codewithcj/sparkyfitness:latest
    restart: on-failure
    depends_on:
      - server
    environment:
      SPARKY_FITNESS_FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:3004"
      SPARKY_FITNESS_SERVER_HOST: thainan-sparkyfitness_server_1
      SPARKY_FITNESS_SERVER_PORT: "3010"
      NGINX_LISTEN_PORT: "80"
