version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-opendesign_web_1
      APP_PORT: 7456
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/nexu-io/od:latest@sha256:c61bb744f057091b4ada678b32142b11f419755713c17203184bbd57cf5057df
    user: "0:0"
    restart: on-failure
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: "7456"
      OD_WEB_PORT: "7456"
      OD_API_TOKEN: "${APP_PASSWORD}"
      OD_ALLOWED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:7456,http://${DEVICE_DOMAIN_NAME},https://${DEVICE_DOMAIN_NAME}:7456
    volumes:
      - ${APP_DATA_DIR}/data:/app/.od
