version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-opendesign_web_1
      APP_PORT: 7456
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/nexu-io/od:latest@sha256:d9a5ba6698f49f3cba78f70586e5b64a0f8e09e384ccf8a1b2c39387a677a66f
    user: "0:0"
    restart: on-failure
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      OD_BIND_HOST: 0.0.0.0
      OD_PORT: "7456"
      OD_WEB_PORT: "7456"
      OD_API_TOKEN: "REMOVIDO-SEGREDO"
      OD_ALLOWED_ORIGINS: http://${DEVICE_DOMAIN_NAME}:7456,http://${DEVICE_DOMAIN_NAME},https://${DEVICE_DOMAIN_NAME}:7456
    volumes:
      - ${APP_DATA_DIR}/data:/app/.od
