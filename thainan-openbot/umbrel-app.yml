support: https://github.com/nightly-labs/openbot/issues
gallery: []
releaseNotes: >-
  Versão 0.61.0-r6: suporte a CUDA liberado com regra device_cgroup_rules para nvidia-uvm (major 510 no host Nonve), recriação resiliente de /dev/nvidia-uvm e /dev/nvidia-uvm-tools no entrypoint, aviso automático se o major do kernel divergir e verificação de GPUs via nvidia-smi -L no start.
