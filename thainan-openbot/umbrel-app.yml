manifestVersion: 1
id: thainan-openbot
name: OpenBot
tagline: Servidor headless do OpenBot para agentes de IA
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-openbot/icon.png
category: AI
version: "0.61.0-r9"
port: 8592
description: >-
  OpenBot (nightly-labs/openbot) rodando como servidor headless no hardware do Nonve.

  Inclui interface web na porta 8592 para verificação de status, envio de código de login por e-mail, confirmação de código e pareamento móvel por código QR (Mobile Connect). O servidor conecta-se à sua conta OpenBot para uso pelo app desktop ou navegador em https://openbot.run/app.

  Pré-configurado para consumir modelos do 9Router local (http://192.168.18.171:20128/v1) através do OpenCode com importação automática da chave do 9Router a partir do Video KB.

  Integração do modelo de decisão por passo para computer use via CLI 'decide' (Liquid AI d1-ultra e fallback Jev via 9Router), ferramenta de mira visual Moondream Cloud ('md') com cursor estilo Hark no display :1, e página de configuração unificada na porta 8592.
developer: nightly-labs
website: https://openbot.run
submitter: Thainan Caldeira
submission: https://github.com/nancmd77/thainan-umbrel-apps
repo: https://github.com/nightly-labs/openbot
support: https://github.com/nightly-labs/openbot/issues
gallery: []
releaseNotes: >-
  Versão 0.61.0-r9: CLI 'decide' para modelo de decisão por passo em Computer Use via Liquid AI (d1-ultra) com fallback resiliente para Jev (~typesafe/jev-latest via 9Router); suporte a --objetivo, --estado, --opcao, --imagem, --limiar (exit 3 e ESCALAR se confianca baixa) e --json; fluxo CUA documentado (AT-SPI -> decide escolhe -> clique pela arvore -> md point se sem rotulo -> modelo grande se exit 3); campos de chave liquid.key e 9router.key na pagina web 8592 (/config e /moondream); remocao do sidecar da porta 8593; e regra cgroup exclusivamente 'c *:* rmw'.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
