manifestVersion: 1
id: thainan-openbot
name: OpenBot
tagline: Servidor headless do OpenBot para agentes de IA
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-openbot/icon.png
category: AI
version: "0.61.0-r2"
port: 8592
description: >-
  OpenBot (nightly-labs/openbot) rodando como servidor headless no hardware do Nonve.

  Inclui interface web mínima na porta 8592 para verificação de status, envio de código de login por e-mail, confirmação de código e pareamento móvel por código QR (Mobile Connect). O servidor conecta-se à sua conta OpenBot para uso pelo app desktop ou navegador em https://openbot.run/app.

  Pré-configurado para consumir modelos do 9Router local (http://192.168.18.171:20128/v1) através do OpenCode com importação automática da chave do 9Router a partir do Video KB.
developer: nightly-labs
website: https://openbot.run
submitter: Thainan Caldeira
submission: https://github.com/nancmd77/thainan-umbrel-apps
repo: https://github.com/nightly-labs/openbot
support: https://github.com/nightly-labs/openbot/issues
gallery: []
releaseNotes: >-
  Versão 0.61.0-r2: corrige permissões de /data com chown recursivo e chmod 700 no init (sem find); importa chave 9Router exclusivamente no init (root) gravando /data/9router_key (modo 600, uid 1000); remove montagem de /vkb do serviço openbot; embute server.py do sidecar web inline no docker-compose para funcionar em updates do Umbrel.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
