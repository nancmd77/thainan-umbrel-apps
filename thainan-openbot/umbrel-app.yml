gallery: []
releaseNotes: >-
  Versão 0.61.0-r5: nós e bibliotecas NVIDIA e subsistema DRI disponibilizados no container sem dependência de nvidia-container-toolkit. Montagem segura read-only do host (/host/dev, /host/lib, /host/bin, /host/share) preservando shm_size e isolamento cgroup restrito a majors 195 (nvidia) e 226 (dri); nós recriados em /dev com permissão 666 via mknod seguro; detecção automática e configuração em tempo de execução de bibliotecas userspace, GLVND vendor e Vulkan ICD sob /usr/local/nvidia/lib se /host/dev/nvidia0 estiver presente; detecção e registro de major dinâmico do nvidia-uvm no init; fallback transparente para CPU/DRI em hosts sem GPU dedicada. Nota: o processo gráfico do Electron upstream inicializa com --use-gl=disabled, logo a aceleração gráfica aplica-se a subprocessos, navegadores e ferramentas auxiliares que usem GL/hardware.
