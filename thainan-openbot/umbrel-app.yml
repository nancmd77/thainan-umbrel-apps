manifestVersion: 1
id: thainan-openbot
storage:
  dataRoot: data
category: ai
name: OpenBot
version: "0.74.0"
tagline: A server for your AI agents
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-openbot/icon.png
description: >-
  OpenBot (nightly-labs/openbot) do jeito original, igual ao app oficial da loja comunitária
  nightly-labs/openbot-umbrel-store. Abra o app e entre com sua conta OpenBot; depois use o servidor
  pelo app desktop, pelo app do celular ou em openbot.run/app.

  Única diferença do original: apparmor=unconfined, porque o AppArmor do host bloqueia os user
  namespaces do sandbox do Electron.
releaseNotes: >-
  Versão 0.74.0: volta ao OpenBot original, sem patches (sem camada própria, painel 8592, omp, decide,
  md e conselho). Página de login oficial do OpenBot. Notas da release:
  https://github.com/nightly-labs/openbot/releases/tag/v0.74.0.
developer: Synthetify Labs
website: https://openbot.run
