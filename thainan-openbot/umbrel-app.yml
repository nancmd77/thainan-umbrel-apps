manifestVersion: 1
id: thainan-openbot
name: OpenBot
tagline: Servidor headless do OpenBot para agentes de IA
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-openbot/icon.png
category: AI
version: "0.68.0-r1"
port: 8592
description: >-
  OpenBot (nightly-labs/openbot) rodando como servidor headless no hardware do Nonve.

  Inclui interface web na porta 8592 para verificação de status, envio de código de login por e-mail, confirmação de código e pareamento móvel por código QR (Mobile Connect). O servidor conecta-se à sua conta OpenBot para uso pelo app desktop ou navegador em https://openbot.run/app.

  Pré-configurado para consumir modelos do 9Router local (http://192.168.18.171:20128/v1) através do OpenCode com importação automática da chave do 9Router a partir do Video KB.

  Integração do modelo de decisão por passo para computer use via CLI 'decide' (Liquid AI d1-ultra e fallback Jev via API oficial TypeSafe), ferramenta de mira visual Moondream Cloud ('md') com cursor estilo Hark no display :1, e página de configuração unificada na porta 8592.
