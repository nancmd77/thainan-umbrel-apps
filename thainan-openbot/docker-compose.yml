version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thainan-openbot_web_1
      APP_PORT: 8592
      PROXY_AUTH_ADD: "false"

  init:
    image: alpine:3.21
    restart: "no"
    user: root
    network_mode: none
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/run:/run/openbot
      - ${APP_DATA_DIR}/../thainan-video-kb/data:/vkb:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/.config/opencode
        mkdir -p /run/openbot
        rm -f /run/openbot/control.sock
        if [ ! -f /data/.config/opencode/opencode.json ]; then
          cat <<'EOF' > /data/.config/opencode/opencode.json
        {
          "$$schema": "https://opencode.ai/config.json",
          "provider": {
            "9router": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "9Router",
              "options": {
                "baseURL": "http://192.168.18.171:20128/v1",
                "apiKey": "{env:OPENBOT_9ROUTER_KEY}"
              },
              "models": {
                "ag/gemini-3.8-flash-high": {
                  "name": "Gemini 3.8 Flash High"
                },
                "ag/gemini-4-argon-high": {
                  "name": "Gemini 4 Argon High"
                },
                "cl/deepseek/deepseek-v4.1-flash-1017": {
                  "name": "DeepSeek v4.1 Flash"
                }
              }
            }
          }
        }
        EOF
        fi
        if [ ! -s /data/9router_key ] && [ -s /vkb/config.json ]; then
          key=$$(sed -n 's/.*"llm_key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /vkb/config.json | tr -d '\r\n ')
          if [ -n "$$key" ]; then
            printf '%s' "$$key" > /data/9router_key
            chmod 600 /data/9router_key
          fi
        fi
        find /data -xdev \! -uid 1000 -exec chown 1000:1000 {} +
        chmod 700 /data
        [ -f /data/9router_key ] && chmod 600 /data/9router_key
        chown 1000:1000 /run/openbot
        chmod 700 /run/openbot

  web:
    image: python:3.12-alpine
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./web:/app:ro
      - ${APP_DATA_DIR}/run:/run/openbot
    working_dir: /app
    entrypoint: ["python3", "-u", "/app/server.py"]
  openbot:
    image: ghcr.io/nightly-labs/openbot:v0.61.0@sha256:7eae38c2354f770bbf924657a908576e23c9bd3387efbf8e7fd52c059fe51a42
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/run:/run/openbot
      - ${APP_DATA_DIR}/../thainan-video-kb/data:/vkb:ro
    environment:
      OPENBOT_9ROUTER_KEY: ${OPENBOT_9ROUTER_KEY:-}
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/bash
      - -c
      - |
        if [ ! -s /data/9router_key ] && [ -s /vkb/config.json ]; then
          key=$$(sed -n 's/.*"llm_key"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' /vkb/config.json | tr -d '\r\n ')
          if [ -n "$$key" ]; then
            printf '%s' "$$key" > /data/9router_key
            chmod 600 /data/9router_key
          fi
        fi
        [ -n "$$OPENBOT_9ROUTER_KEY" ] || { [ -s /data/9router_key ] && export OPENBOT_9ROUTER_KEY=$$(tr -d '\r\n' < /data/9router_key); }
        exec /opt/OpenBot/app/resources/hosting/openbot-container
