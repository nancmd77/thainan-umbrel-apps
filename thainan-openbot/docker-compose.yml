            pgrep -f '^/opt/OpenBot/app/openbot --type=gpu' >/dev/null 2>&1 && break
            sleep 0.5
          done
          sleep 1
          xprop -root -display :1 -f AT_SPI_BUS 8s -set AT_SPI_BUS "$$AT_SPI_BUS_ADDRESS"
          xprop -root -display :0 -f AT_SPI_BUS 8s -set AT_SPI_BUS "$$AT_SPI_BUS_ADDRESS"
        ) &
        exec /opt/OpenBot/app/resources/hosting/openbot-container
