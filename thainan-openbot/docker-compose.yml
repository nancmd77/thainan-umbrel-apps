        ---
        name: openui-hark
        description: Use sempre que a resposta pedir um cartão no chat (tabela, comparação, pergunta com opções, várias escolhas, campos de texto, sim ou não, confirmação de compra, login, chave de API, código de verificação). Desenha o cartão com OpenUI no estilo Hark e mostra com html_render.
        ---

        # Cartões OpenUI no estilo Hark

        Quando usar: uma pergunta que o Nan responde tocando (em vez de digitar), um conjunto pra comparar (tabela), ou uma confirmação antes de agir. Resposta que é um fato ou uma frase continua só texto.

        ## Como
        1. Escreva o cartão em OpenUI Lang num arquivo `.oui` (comece pelo exemplo mais parecido em `exemplos/`).
        2. `python3 ~/.agents/skills/openui-hark/montar.py cartao.oui cartao.html`
        3. Confira com `openbot.html_preview` (veja o print e o console). Corrija se quebrar.
        4. Mostre com `openbot.html_render` (título curto, o HTML inteiro). Depois escreva só o que o cartão não diz, numa frase.
        5. O toque do Nan volta como mensagem dele, com os valores marcados em JSON. Leia e siga.

        ## Estilo Hark (o CSS já faz o visual; você cuida do conteúdo)
        - Título = a pergunta ou o nome do conjunto, curto. Subtítulo só quando ajuda ("Pode marcar mais de um").
        - Opções com rótulo curto e uma descrição de poucas palavras. 2 a 4 opções; a mais provável primeiro e já marcada.
        - Tabela: 3 colunas no máximo no celular, poucas palavras por célula. Uma frase de escolha embaixo (TextContent "small"): "Eu iria de X: motivo."
        - Botão principal com verbo ("Enviar", "Fazer pedido", "Pode aplicar"). Secundário só pra recusar ou mudar.
        - Nada de rótulo em caixa alta, nada inventado: todo valor vem de fonte real.

        ## Segurança (obrigatório)
        - Nunca ponha campo de senha, cartão ou chave de API no cartão: o cartão só manda texto pro chat. Os exemplos `login-seguro` e `chave-api` mostram a conta ou o serviço e o botão pede o cofre. Ao receber "Abrir login seguro: <site>" ou "Abrir cofre: chave <host>", use o cofre ou o request_takeover do OpenBot.
        - Código de verificação (SMS, e-mail, app) pode ir no cartão `codigo`.
        - Compra: o cartão `confirmar-compra` mostra itens, total e o cartão de pagamento; só cobre depois do toque do Nan.

        ## OpenUI Lang (resumo)
        - Cada linha: `nome = Expressao`. A primeira linha é `root = Card([...])`. Argumentos são posicionais. Todo nome precisa ser usado a partir do root.
        - CardHeader(titulo, subtitulo?) · TextContent(texto, "small") · Table([Col(rotulo, lista)]) · Callout(variante, titulo, descricao)
        - Form(nome, Buttons, [FormControl(rotulo, campo)]) · Input(nome, placeholder, tipo, {required: true}) · TextArea(nome, placeholder, linhas)
        - RadioGroup(nome, [RadioItem(rotulo, descricao, valor)], valorPadrao) · CheckBoxGroup(nome, [CheckBoxItem(rotulo, descricao, nome, marcado?)])
        - Buttons([Button(rotulo, Action([@ToAssistant("texto")]), "primary"|"secondary")], "row"|"column") · @OpenUrl("https://...") abre link
        - FollowUpBlock([FollowUpItem("texto")]) pra sugestões de próximo passo no fim.
        - Gráficos: BarChart(rotulos, [Series(nome, valores)]), LineChart, PieChart(rotulos, valores).
