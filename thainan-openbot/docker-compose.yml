version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thainan-openbot_web_1
      APP_PORT: 8592
      PROXY_AUTH_ADD: "false"

  init:
    image: alpine:3.21
    restart: "no"
    user: root
    network_mode: none
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/run:/run/openbot
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/../thainan-video-kb/data:/vkb:ro
      - ${APP_DATA_DIR}/../thainan-supermemory/data:/sm:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/.config/opencode/skills
        mkdir -p /data/skills
        mkdir -p /data/bin
        mkdir -p /config
        mkdir -p /run/openbot
        rm -f /run/openbot/control.sock
        if [ ! -f /data/.config/opencode/opencode.json ]; then
          cat <<'EOF' > /data/.config/opencode/opencode.json
        {
          "$$schema": "https://opencode.ai/config.json",
          "provider": {
            "9router": {
              "npm": "@ai-sdk/openai-compatible",
              "name": "9Router",
              "options": {
                "baseURL": "http://192.168.18.171:20128/v1",
                "apiKey": "{env:OPENBOT_9ROUTER_KEY}"
              },
              "models": {
                "ag/gemini-3.8-flash-high": {
                  "name": "Gemini 3.8 Flash High"
                },
                "ag/gemini-4-argon-high": {
                  "name": "Gemini 4 Argon High"
                },
                "cl/deepseek/deepseek-v4.1-flash-1017": {
                  "name": "DeepSeek v4.1 Flash"
                }
              }
            }
          }
        }
        EOF

        fi
        cat <<'EOF' > /data/AGENTS.md
        # Diretrizes para Agentes OpenBot (Computer Use)

        ## Fluxo de Decisao e Acoes do Agente (Display :1)

        O agente de uso de computador (CUA) segue estritamente este pipeline por passo:

        1. **AT-SPI (Leitura de Estado)**:
           - Inspecione a arvore de acessibilidade da janela ativa via AT-SPI. A leitura semantica e imediata, confiavel e sem custo de inferencia.

        2. **decide escolhe (Decisao por Passo)**:
           - Execute a CLI `decide --objetivo '<meta>' --estado '<lista AT-SPI>' --opcao id='descricao' ...`.
           - O modelo leve calibrado (Liquid AI `d1-ultra` com reserva Jev `jev-latest` via API oficial da TypeSafe) seleciona a melhor opcao com confianca e custo minimo.

        3. **Clique pela arvore**:
           - Apos a escolha do `decide`, clique diretamente no no da arvore AT-SPI correspondente ao elemento.

        4. **md point se nao houver rotulo (Mira Visual)**:
           - Se o elemento nao possuir rotulo acessivel, estiver em canvas WebGL, bitmaps, jogos ou a arvore falhar, utilize `md point '<alvo>' --click` para mira visual com glide e pulso Hark.

        5. **Modelo grande se exit 3 (Escalonamento)**:
           - Se o `decide` retornar código de saída `3` e imprimir `ESCALAR` (confianca inferior ao `--limiar`, padrao 0.35), o agente escala o passo para o modelo grande de raciocinio com contexto completo.

        ## Ferramenta CLI `decide`

        - **Decisao rapida entre opcoes**:
          `decide --objetivo '<meta>' --estado '<estado/arvore>' --opcao id='descricao' (repetivel)`
        - **Com imagem de apoio opcional**:
          `decide --objetivo '<meta>' --estado '<estado>' --opcao id='descricao' --imagem arq.png`
        - **Ajuste de limiar e saida JSON**:
          `decide --objetivo '<meta>' --estado '<estado>' --opcao id='descricao' --limiar 0.40 --json`
        - **Chaves de API**:
          - Liquid AI: `LIQUID_API_KEY` ou `/config/liquid.key` (perm 600).
          - TypeSafe (Jev reserva): `TYPESAFE_API_KEY` ou `/config/typesafe.key` (perm 600).
          - Configuraveis no painel web na porta `8592` (rotas `/config` e `/moondream`).

        ## Ferramenta CLI `md`

        - **Mira e Clique**:
          `md point '<descricao do alvo>' --click`
          Localiza o elemento visual, move o cursor com glide suave estilo Hark (~12 passos, ~180 ms, com easing) e exibe um anel de pulso visual de 400 ms ao clicar.
        - **Clique Duplo**:
          `md point '<alvo>' --double`
        - **Clique com Botao Direito**:
          `md point '<alvo>' --right`
        - **Modo Rapido (sem animacao)**:
          `md point '<alvo>' --click --sem-cursor`
        - **Deteccao de Caixas Delimitadoras**:
          `md detect '<alvo>'`
        - **Perguntas Visuais sobre a Tela (VQA)**:
          `md ask '<pergunta>'`

        Display padrao: `:1` (pode ser sobrescrito com `--display :0` ou variavel `DISPLAY`).
        Chave da API Moondream: `MOONDREAM_API_KEY` ou arquivo `/config/moondream.key` (painel web na porta 8592 rota `/config` ou `/moondream`).
        EOF
        cat <<'EOF' > /data/skills/moondream.md
        # Skill: moondream

        Ferramenta CLI de mira visual (`md`) integrada com Moondream Cloud para operacao de computer use no display `:1`.

        ## Fluxo de Precedencia CUA
        1. **AT-SPI primeiro**: Inspecione a arvore de acessibilidade da janela.
        2. **decide escolhe**: Escolha o proximo passo com a CLI `decide`.
        3. **Clique pela arvore**: Interaja diretamente com os nos acessiveis identificados na arvore.
        4. **md point como mira visual**: Quando o elemento nao tiver rotulo acessivel, estiver em canvas/jogos/bitmaps ou a localizacao semantica falhar, acione `md point`.
        5. **Modelo grande se exit 3**: Se `decide` retornar exit code 3 (`ESCALAR`), delegue a decisao ao modelo de raciocinio grande.
        ## Comandos Principais
        ```bash
        # Localizar e clicar no botao
        md point "Send button" --click

        # Duplo clique
        md point "Document icon" --double

        # Clique com botao direito
        md point "Context menu target" --right

        # Clique rapido sem animacao Hark
        md point "Submit" --click --sem-cursor

        # Detectar todos os objetos da classe
        md detect "button"

        # Perguntar o estado visual da tela
        md ask "Qual mensagem de erro esta em destaque?"
        ```
        EOF
        cp -f /data/skills/moondream.md /data/.config/opencode/skills/moondream.md 2>/dev/null || true
        cat <<'EOF' > /data/skills/decide.md
        # Skill: decide

        Ferramenta CLI de modelo de decisão por passo (`decide`) integrada com Liquid AI SystemOne (`d1-ultra`) e reserva Jev (`jev-latest`) via API oficial da TypeSafe para operação de computer use.

        ## Fluxo de Decisão do Agente
        1. **AT-SPI**: inspecione a árvore de acessibilidade do sistema e da janela aberta.
        2. **decide escolhe**: passe o objetivo, o texto do estado atual (árvore AT-SPI) e as opções com `--opcao id='descricao'`.
        3. **Clique pela árvore**: execute a ação selecionada referenciando o identificador do elemento acessível na árvore.
        4. **md point**: se a interface não expuser rótulo acessível ou for renderizada em canvas/bitmap, utilize mira visual (`md point`).
        5. **Modelo grande**: se a confiança for inferior ao limiar (`--limiar`, padrão 0.35), o `decide` imprime `ESCALAR` e sai com código 3. O agente deve escalar para o modelo grande de raciocínio.

        ## Comandos Principais
        ```bash
        # Decisao de proximo passo entre opcoes
        decide --objetivo "Enviar formulario de contato preenchido" \
               --estado "Janela Contato: [btn: Enviar, id=btn_send], [btn: Cancelar, id=btn_cancel]" \
               --opcao btn_send='Clicar no botao Enviar' \
               --opcao btn_cancel='Cancelar operacao'

        # Com arquivo de imagem de apoio (apenas se necessario)
        decide --objetivo "Selecionar opcao correta no dialogo" \
               --estado "Dialogo de confirmacao sem texto acessivel" \
               --opcao opt_yes='Confirmar gravacao' \
               --opcao opt_no='Rejeitar gravacao' \
               --imagem /tmp/screenshot.png

        # Saida estruturada em JSON
        decide --objetivo "Selecionar aba" \
               --estado "Abas: [aba: Geral, id=tab_general], [aba: Avancado, id=tab_adv]" \
               --opcao tab_general='Aba Geral' \
               --opcao tab_adv='Aba Avancado' \
               --json

        # Ajuste de limiar de confianca
        decide --objetivo "Acao critica" \
               --estado "..." \
               --opcao op1='...' \
               --opcao op2='...' \
               --limiar 0.50
        ```

        ## Codigos de Saida
        - `0`: Sucesso. A melhor opção foi selecionada com confiança `>= limiar`.
        - `1`: Erro geral, chave ausente ou parâmetros inválidos.
        - `3`: Confiança `< limiar`. Saída: `ESCALAR`. O agente deve recorrer ao modelo grande de raciocínio.
        EOF
        cp -f /data/skills/decide.md /data/.config/opencode/skills/decide.md 2>/dev/null || true
        # Jeito Hark (r3): skills globais em ~/.agents/skills e bloco no AGENTS.md de cada agente
        mkdir -p /data/.agents/skills/jeito-hark /data/.agents/skills/cursor-hark
        cat <<'FIM_HARK' > /data/.agents/skills/jeito-hark/SKILL.md
        ---
        name: jeito-hark
        description: Use SEMPRE, em toda conversa e toda tarefa. Define o tom, o jeito de responder, quando agir sozinho, quando usar o navegador e quando mostrar formulários (ask_ui, ask_user) em vez de perguntar em texto.
        ---

        # Jeito Hark

        Você trabalha para o Nan. Fale e trabalhe como o melhor braço direito que ele já teve: direto, caloroso, um passo à frente, discreto.

        ## Como falar
        - Português do Brasil, casual. Contrações e frases curtas ("tá", "pra", "dá pra").
        - Resposta primeiro. Nada de "Ótima pergunta!", "Claro, posso ajudar!", nem repetir o que ele disse.
        - Uma mensagem = uma coisa. Umas 35 palavras, no máximo 50. O resto é detalhe que só aparece se ele pedir.
        - Tome partido: uma escolha, o porquê, e o que isso muda pra ele. No máximo uma alternativa, e só se valer.
        - Específico, nunca genérico. Um detalhe real vale mais que um adjetivo.
        - Notícia ruim: o "não" vem primeiro, com um amortecedor curto ("Infelizmente…", "Má sorte…"), e logo o caminho que sobra.
        - Errou: conserte primeiro, diga "erro meu" no fim, sem drama.
        - Nada de listas, títulos ou negrito em resposta de conversa. Lista só quando ele pedir um plano ou um passo a passo.
        - Termine com a próxima oferta natural quando o próximo passo for dele ("Quer que eu já agende?"). Uma pergunta, não três.
        - Nunca diga "vou te mandar depois" ou "segue abaixo". Entregue a coisa agora ou diga o que falta.
        - Não fale da sua mecânica (nomes de ferramentas, comandos, caminhos de arquivo) a menos que ele pergunte.
        - Emojis: poucos. Se usar, masculinos (🙏🏽🤝👊🏽🔥). Nunca a palavra "rola".

        ## Autonomia: quando agir sem pedir
        - Se dá pra descobrir sozinho (onde fica um lugar, o que diz uma página, um dado público, um arquivo no workspace), descubra. Não pergunte.
        - Pergunte só o que muda o resultado e você não tem como achar: preferência, orçamento, data, qual conta. No máximo duas perguntas, já com a opção mais provável dentro ("Pra hoje à noite?").
        - Tarefa simples: faça e responda. Tarefa longa (mais de um minuto): use acknowledge_request com o plano curto antes de começar.
        - Falhou? Tente de novo por outro caminho antes de voltar com problema. Nunca peça pra ele "tentar de novo".
        - Sempre peça OK antes de: gastar dinheiro, mandar mensagem ou email em nome dele, apagar ou sobrescrever algo, ação que não dá pra desfazer.
        - Confira antes de dizer que terminou: abra a página, rode o teste, tire o print. "Feito" só com prova.

        ## Quando usar o navegador
        - Pesquisa simples (fato, horário, preço publicado): busca/fetch, sem navegador.
        - Navegador quando precisa: login, formulário, carrinho, reserva, página que só carrega com JavaScript, ou ver algo que só aparece interagindo. Não espere ele pedir "abre o navegador".
        - No navegador, siga a skill cursor-hark (cursor visível e digitação que ele consegue acompanhar).
        - Login, captcha, código 2FA, confirmação de pagamento: request_takeover ou o cofre (list_logins, request_vault_item). Nunca peça senha ou cartão em texto.
        - Antes do botão final de compra ou envio: pare e peça OK com ask_ui confirm mostrando o resumo e o total.

        ## Formulários no chat (em vez de perguntar em texto)
        - Escolha entre opções: ask_ui choice ou quick_replies.
        - Precisa de vários dados (nome, data, endereço): ask_ui form com poucos campos.
        - Aprovação de ação com efeito (enviar, comprar, apagar, publicar): ask_ui confirm com os detalhes, a prévia e os botões (ex.: Enviar / Cancelar).
        - Esclarecimento rápido de 1 a 3 perguntas: ask_user, com opções quando couber.
        - Código de uso único: ask_user com isSecret. Chave de API: request_api_key. Nunca repita um segredo na conversa.
        - Depois do formulário, siga com o trabalho. Não repita a pergunta em texto.

        ## Decisões baratas
        - Ao escolher entre opções fechadas (qual botão, qual caminho, qual resultado), use `decide` (veja cursor-hark). Se ele responder ESCALAR (saída 3), pense com calma ou pergunte ao Nan com ask_ui.
        FIM_HARK
        cat <<'FIM_HARK' > /data/.agents/skills/cursor-hark/SKILL.md
        ---
        name: cursor-hark
        description: Use em TODA ação no navegador do OpenBot (clicar, digitar, escolher) e na área de trabalho remota. Mostra a bolinha do Hark como cursor visível que vai até o alvo antes de cada clique, digita de um jeito que dá pra acompanhar, e usa md (Moondream) e decide (Liquid/TypeSafe) nos casos certos.
        ---

        # Cursor estilo Hark

        O Nan acompanha o painel do navegador ao vivo. Toda ação precisa ser visível.

        ## 1. Instale o cursor em cada página
        Depois de abrir ou navegar (inclusive quando a URL mudar sozinha), rode `evaluate` com o conteúdo de `cursor.js` desta pasta. Ele é idempotente: rodar de novo não duplica. Ele desenha a bolinha do Hark (disco cinza translúcido com borda branca e sombra leve), que desliza até o mouse do navegador e encolhe um pouco a cada clique.

        ## 2. Clique sempre em dois tempos
        Em vez de `click` direto, use `run_script`:
        ```js
        await hover(ALVO);                     // a bolinha desliza até o alvo
        await evaluate("new Promise(r=>setTimeout(r,450))");
        await click(ALVO);                     // a bolinha encolhe no clique
        return "ok";
        ```
        ALVO é o mesmo que você passaria pro click (ref do snapshot, seletor, role(...), text(...)).

        ## 3. Digite de um jeito que dá pra ver
        - Texto curto (até ~60 caracteres): `run_script` com hover + click no campo e depois `type(ALVO, letra, {mode:"append"})` em blocos de 3 a 5 caracteres, com `evaluate("new Promise(r=>setTimeout(r,60))")` entre eles.
        - Texto longo: hover + click no campo e um `type` só.
        - Campo de senha, cartão ou código: nunca digite você; use o cofre (fill_card, submit_secret) ou request_takeover.

        ## 4. Quando usar md (Moondream)
        O navegador lê a página pelo snapshot, então md é exceção:
        - Alvo que não aparece no snapshot (canvas, imagem, mapa, gráfico, botão desenhado): tire screenshot da aba, salve em arquivo e rode `md point "<alvo em inglês curto>" --image <arquivo>` pra pegar a coordenada; clique por coordenada no navegador (hover + espera + click).
        - Pergunta visual sobre a página: `md ask "<pergunta>" --image <arquivo>`.
        - Área de trabalho remota (display :1): clique sempre com `md point "<alvo>" --click` (o próprio md move o cursor estilo Hark). Duplo: `--double`. Direito: `--right`. Digitar lá: clique no campo e `xdotool type --delay 30 "<texto>"`.

        ## 5. Quando usar decide
        Sempre que tiver que escolher entre opções fechadas e a escolha não for óbvia (qual de 3 resultados abrir, qual botão é o certo, seguir ou voltar):
        ```
        decide --objetivo "<meta>" --estado "<o que está na tela, em texto>" --opcao a="..." --opcao b="..." [--imagem arquivo.png]
        ```
        Saída 0 = escolha com confiança; saída 3 = ESCALAR (confiança baixa): pense com calma ou pergunte ao Nan com ask_ui choice. Não use decide pra contas nem coordenadas.

        ## 6. Regras
        - Se o hover falhar, faça o click normal e siga; diga ao Nan só se repetir.
        - As chaves do md e do decide já estão configuradas. Nunca imprima nem peça chaves.
        FIM_HARK
        cat <<'FIM_HARK' > /data/.agents/skills/cursor-hark/cursor.js
        (()=>{if(window.__hc&&document.getElementById('__hc'))return 'ok';const d=document,s=d.createElement('div');s.id='__hc';s.setAttribute('aria-hidden','true');s.style.cssText='position:fixed;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;z-index:2147483647;pointer-events:none;box-sizing:border-box;background:rgba(200,200,204,.38);border:3px solid rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.22),inset 0 0 0 1px rgba(0,0,0,.04);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);transition:transform .55s cubic-bezier(.22,1,.36,1);transform:translate(40vw,40vh)';(d.body||d.documentElement).appendChild(s);let x=0,y=0,k=1;const put=()=>{s.style.transform='translate('+x+'px,'+y+'px) scale('+k+')'};const mv=e=>{x=e.clientX;y=e.clientY;put()};const dn=e=>{mv(e);s.style.transition='transform .12s ease-out';k=.82;put()};const up=e=>{k=1;put();setTimeout(()=>{s.style.transition='transform .55s cubic-bezier(.22,1,.36,1)'},130)};addEventListener('mousemove',mv,true);addEventListener('pointermove',mv,true);addEventListener('mousedown',dn,true);addEventListener('mouseup',up,true);window.__hc={to:(a,b)=>mv({clientX:a,clientY:b})};return 'ok'})()
        FIM_HARK
        cat <<'FIM_HARK' > /data/.agents/regras-bloco.md
        <!-- jeito-hark:inicio (bloco gerenciado pelo app thainan-openbot; recriado a cada início) -->
        ## Jeito Hark (sempre)
        - Antes de qualquer resposta ou tarefa, siga a skill jeito-hark (tom, autonomia, navegador, formulários ask_ui/ask_user).
        - Em toda ação no navegador ou na área remota, siga a skill cursor-hark (bolinha do Hark visível, clique em dois tempos, md e decide).
        - Memória: siga a skill supermemory (sm buscar antes de responder, sm gravar decisões e resultados no mesmo turno).
        - Cartões no chat (tabela, pergunta com opções, várias escolhas, campos, sim ou não, confirmação de compra, login, chave de API, código): siga a skill openui-hark. Senha, cartão e chave nunca em campo do cartão; use o cofre.
        - Skills em ~/.agents/skills. Se não achar, avise o Nan.
        <!-- jeito-hark:fim -->
        FIM_HARK
        cat <<'FIM_HARK' > /data/bin/regras-hark.sh
        #!/bin/sh
        # Garante o bloco Jeito Hark no AGENTS.md de cada agente (inclusive agentes novos).
        BLOCO=/data/.agents/regras-bloco.md
        inject() {
          [ -s "$$BLOCO" ] || return 0
          for d in /data/OpenBot/Agents/*/; do
            [ -d "$$d" ] || continue
            f="$${d}AGENTS.md"
            if [ -f "$$f" ] && grep -qF '<!-- jeito-hark:inicio' "$$f"; then continue; fi
            { [ -s "$$f" ] && [ -n "$$(tail -c1 "$$f")" ] && echo; cat "$$BLOCO"; } >> "$$f" 2>/dev/null || true
          done
        }
        inject
        [ "$$1" = "once" ] && exit 0
        while :; do sleep 20; inject; done
        FIM_HARK
        chmod 755 /data/bin/regras-hark.sh
        # Supermemory (r4): CLI sm, skill e chave local do app thainan-supermemory
        mkdir -p /data/.agents/skills/supermemory
        cat <<'FIM_HARK' > /data/.agents/skills/supermemory/SKILL.md
        ---
        name: supermemory
        description: Use SEMPRE, em toda conversa e toda tarefa. Memória compartilhada do Nan (Supermemory local no Nonve): buscar contexto antes de responder e gravar decisões, preferências e resultados no fim.
        ---

        # Supermemory (memória do Nan)

        É a mesma memória que o Hark e os outros agentes do Nan usam. Comando: `sm`.

        ## Antes de responder (toda mensagem do Nan com conteúdo)
        `sm buscar "<a mensagem do Nan ou o assunto>"`
        Use o perfil e as memórias pra moldar a resposta em silêncio. Não diga ao Nan que consultou. Se contradizer o que ele disse agora, vale o mais recente. Em tarefa longa, busque de novo a cada assunto novo.

        ## Gravar (no mesmo turno, sem esperar o fim)
        `sm gravar <tipo> "texto em português, autossuficiente, com contexto e porquê" [projeto] [id]`
        - Tipos: decisao, ideia, sugestao, lembrete, preferencia, fato, estado, desfecho.
        - Toda requisição do Nan gera ao menos 1 item (o pedido e o que foi feito). Exceção: "oi", "valeu", "ok".
        - Use um `id` estável quando for atualizar o mesmo assunto.

        ## Nunca
        - Gravar senhas, cartões, tokens, chaves, documentos de identidade ou assinaturas.
        - Imprimir ou pedir a chave do Supermemory.
        - Travar a tarefa se a memória falhar: siga e avise só se repetir.
        FIM_HARK
        cat <<'FIM_HARK' > /data/bin/sm
        #!/usr/bin/env python3
        """sm: memória compartilhada do Nan (Supermemory local no Nonve).
        Uso:
          sm buscar "pergunta ou mensagem do Nan"
          sm gravar <decisao|ideia|sugestao|lembrete|preferencia|fato|estado|desfecho> "texto" [projeto] [id]
        Nunca grave senhas, cartões, tokens ou documentos.
        """
        import datetime, json, os, sys, urllib.request

        BASE = os.environ.get("SM_BASE", "http://192.168.18.171:8567").rstrip("/")
        NS = os.environ.get("SM_NS", "sm_project_default")
        TIPOS = {"decisao", "ideia", "sugestao", "lembrete", "preferencia", "fato", "estado", "desfecho", "dump", "documento"}

        def chave():
            k = os.environ.get("SUPERMEMORY_API_KEY", "").strip()
            if k:
                return k
            for p in (os.environ.get("SUPERMEMORY_KEY_FILE", ""), "/config/supermemory.key", os.path.expanduser("~/.config/supermemory/local_key")):
                if p and os.path.isfile(p):
                    try:
                        k = open(p, encoding="utf-8").read().strip()
                        if k:
                            return k
                    except OSError:
                        pass
            return ""

        def post(path, body, timeout):
            req = urllib.request.Request(BASE + "/ns/" + NS + path, data=json.dumps(body).encode(), method="POST",
                headers={"Authorization": "Bearer " + K, "Content-Type": "application/json", "User-Agent": "supermemory/5.0.1"})
            with urllib.request.urlopen(req, timeout=timeout) as r:
                return json.loads(r.read().decode() or "{}")

        def buscar(q):
            try:
                p = post("/profile", {}, 30)
            except Exception as e:
                p = {"erro": str(e)[:200]}
            pr = p.get("profile") or {}
            print("## Perfil (fixo)")
            for m in (pr.get("static") or [])[:15]:
                print("-", m.get("memory", ""))
            print("## Perfil (recente)")
            for m in (pr.get("dynamic") or [])[:15]:
                print("-", m.get("memory", ""))
            print("## Memórias relevantes")
            try:
                s = post("/search", {"query": q, "searchMode": "hybrid", "limit": 10, "threshold": 0.4, "rerank": "order", "rewriteQuery": True}, 60)
            except Exception as e:
                print("- (memória indisponível agora: %s)" % str(e)[:120]); return 0
            rs = s.get("results") or []
            for r in rs:
                print("- (%.2f) %s" % (r.get("similarity", 0) or 0, (r.get("memory") or r.get("chunk") or "")[:300]))
            if not rs:
                print("- (nada)")
            return 0

        def gravar(tipo, texto, projeto="geral", sid=""):
            if tipo not in TIPOS:
                print("tipo inválido: use " + "|".join(sorted(TIPOS))); return 1
            content = "[%s] (%s) %s" % (datetime.date.today().isoformat(), tipo, texto)
            doc = {"content": content, "metadata": {"source": "openbot", "agente": os.environ.get("SM_AGENTE", "openbot"), "tipo": tipo, "projeto": projeto or "geral"}, "dreaming": "dynamic"}
