        """Monta a página HTML de um cartão OpenUI no estilo Hark.
        Uso: python3 montar.py cartao.oui [saida.html]   (sem saída: imprime o HTML)
        Depois passe o HTML inteiro para openbot.html_render (confira antes com html_preview)."""
