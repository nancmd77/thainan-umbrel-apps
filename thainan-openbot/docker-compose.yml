version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thainan-openbot_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/nightly-labs/openbot:0.75.0
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: "1gb"
    security_opt:
      - seccomp=${APP_DATA_DIR}/seccomp.json
      - no-new-privileges:true
      - apparmor=unconfined
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      OPENBOT_SETUP_PAGE_PORT: "8080"
