        <link rel="stylesheet" href="{CDN}/openui-styles.css"><style>{css}</style></head><body><div id="r0"></div>
        <script>
        var C={json.dumps(codes, ensure_ascii=False)};
        function act(e){{var t=e.humanFriendlyMessage||(e.params&&e.params.message)||"";
        if(e.type==="open_url"&&e.params){{window.open(e.params.url);return}}
        if(e.formState&&Object.keys(e.formState).length){{t=(t?t+"\\n":"")+JSON.stringify(e.formState)}}
        if(t&&window.openbotPage)window.openbotPage.sendMessage(t)}}
        var s=document.createElement("script");s.src="{CDN}/openui-bundle.min.js";
        s.onload=function(){{var O=window.__OpenUI;O.createRoot(document.getElementById("r0")).render(O.React.createElement(O.Renderer,{{response:C[0],library:O.openuiChatLibrary,isStreaming:false,onAction:act}}))}};
        document.head.appendChild(s);
        </script></body></html>'''
        if len(sys.argv) > 2: open(sys.argv[2], "w").write(html)
