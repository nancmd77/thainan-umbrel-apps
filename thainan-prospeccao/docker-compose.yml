version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-prospeccao_n8n_1
      APP_PORT: 5678
      PROXY_AUTH_ADD: "false"

  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: db
      TZ: UTC
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /docker-entrypoint-initdb.d
        printf "CREATE DATABASE n8n;\nCREATE DATABASE evolution;\nCREATE EXTENSION IF NOT EXISTS vector;\nCREATE EXTENSION IF NOT EXISTS pgcrypto;\nCREATE EXTENSION IF NOT EXISTS pg_trgm;\n" > /docker-entrypoint-initdb.d/00-bancos.sql
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.1@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
    restart: on-failure
    command: ["redis-server", "--requirepass", "${APP_SEED}", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data

  n8n:
    image: n8nio/n8n:2.30.4@sha256:d1606a508b1e426de07a98fa10f3758ef474b17590c6f181a0dd38c999f819d0
    restart: on-failure
    # a pasta de dados nasce como root no Umbrel; o n8n (uid 1000) não conseguia gravar config
    user: "0:0"
    depends_on:
      - db
      - redis
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: thainan-prospeccao_db_1
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${APP_SEED}
      N8N_ENCRYPTION_KEY: ${APP_SEED}
      N8N_USER_FOLDER: /home/node
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DEFAULT_LOCALE: en
      N8N_PROTOCOL: https
      N8N_HOST: prospeccao.nonve.dpdns.org
      WEBHOOK_URL: https://prospeccao.nonve.dpdns.org/
      N8N_EDITOR_BASE_URL: https://prospeccao.nonve.dpdns.org/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false"
      N8N_PAYLOAD_SIZE_MAX: "200"
      N8N_FORMDATA_FILE_SIZE_MAX: "50"
      EXECUTIONS_TIMEOUT: "-1"
      EXECUTIONS_TIMEOUT_MAX: "3600"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ${APP_DATA_DIR}/data/n8n:/home/node/.n8n

  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: on-failure
    depends_on:
      - db
      - redis
    environment:
      SERVER_URL: http://thainan-prospeccao_evolution_1:8080
      AUTHENTICATION_API_KEY: ${APP_SEED}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LANGUAGE: en
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${APP_SEED}@thainan-prospeccao_db_1:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${APP_SEED}@thainan-prospeccao_redis_1:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: "604800"
      CACHE_LOCAL_ENABLED: "false"
      CHATWOOT_ENABLED: "true"
      N8N_ENABLED: "true"
      OPENAI_ENABLED: "true"
      CORS_ORIGIN: "*"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      TZ: America/Sao_Paulo
    volumes:
      - ${APP_DATA_DIR}/data/evolution:/evolution/instances
