version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-bugsink_web_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"
  db:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: bugsinkuser
      POSTGRES_PASSWORD: "${APP_THAINAN_BUGSINK_POSTGRES_PASSWORD}"
      POSTGRES_DB: bugsink
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugsinkuser -d bugsink"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    image: bugsink/bugsink:2
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: "${APP_THAINAN_BUGSINK_SECRET_KEY}"
      CREATE_SUPERUSER: "admin@umbrel.local:changeme-bugsink"
      PORT: "8000"
      DATABASE_URL: "postgresql://bugsinkuser:${APP_THAINAN_BUGSINK_POSTGRES_PASSWORD}@thainan-bugsink_db_1:5432/bugsink"
      BEHIND_HTTPS_PROXY: "false"
      USE_X_FORWARDED_HOST: "true"
      BASE_URL: "http://${DEVICE_DOMAIN_NAME}:8000"
