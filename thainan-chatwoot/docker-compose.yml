version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-chatwoot_rails_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  # Segredos (SECRET_KEY_BASE, POSTGRES_PASSWORD, REDIS_URL no rails e no sidekiq;
  # POSTGRES_PASSWORD no postgres; REDIS_PASSWORD no redis) NAO ficam neste repo:
  # entram pelo env custom do app no Umbrel (Configuracoes do app). Sem eles o
  # Chatwoot nem sobe (fica esperando).
  rails:
    image: chatwoot/chatwoot:v4.19.1
    restart: on-failure
    depends_on:
      - postgres
      - redis
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - -c
      - |
        while [ -z "$$SECRET_KEY_BASE" ] || [ -z "$$POSTGRES_PASSWORD" ] || [ -z "$$REDIS_URL" ]; do
          echo "aguardando os segredos no env custom do app (SECRET_KEY_BASE, POSTGRES_PASSWORD, REDIS_URL)"; sleep 60
        done
        bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:3000"
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "false"
      RACK_TIMEOUT_SERVICE_TIMEOUT: "60"
      DEFAULT_LOCALE: pt_BR
      ACTIVE_STORAGE_SERVICE: local
      POSTGRES_HOST: thainan-chatwoot_postgres_1
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      RAILS_LOG_TO_STDOUT: "true"
      # WAHA e n8n ficam na rede interna do Umbrel; sem isso o SafeFetch (v4.14+) recusa o webhook do inbox.
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/storage

  sidekiq:
    image: chatwoot/chatwoot:v4.19.1
    restart: on-failure
    depends_on:
      - postgres
      - redis
    command:
      - sh
      - -c
      - |
        while [ -z "$$SECRET_KEY_BASE" ] || [ -z "$$POSTGRES_PASSWORD" ] || [ -z "$$REDIS_URL" ]; do
          echo "aguardando os segredos no env custom do app (SECRET_KEY_BASE, POSTGRES_PASSWORD, REDIS_URL)"; sleep 60
        done
        exec bundle exec sidekiq -C config/sidekiq.yml
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:3000"
      FORCE_SSL: "false"
      POSTGRES_HOST: thainan-chatwoot_postgres_1
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      RAILS_LOG_TO_STDOUT: "true"
      # WAHA e n8n ficam na rede interna do Umbrel; sem isso o SafeFetch (v4.14+) recusa o webhook do inbox.
      SAFE_FETCH_ALLOW_PRIVATE_NETWORK: "true"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/storage

  postgres:
    image: pgvector/pgvector:pg16
    restart: on-failure
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --protected-mode yes --bind 127.0.0.1
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
