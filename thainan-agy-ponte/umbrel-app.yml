manifestVersion: 1
id: thainan-agy-ponte
name: Ponte do Antigravity (Orchestrator)
tagline: Usa o Orchestrator do Antigravity CLI como modelo OpenAI-compatible
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-agy-ponte/icon.png
category: AI
version: "1.0.0"
port: 8647
description: >-
  Traduz POST /v1/chat/completions (formato OpenAI, com e sem stream) para o Antigravity CLI (agy) em modo de impressão, com o Orchestrator (planejador Neon ou Argon + executor Hydrogen). Cada pedido roda num diretório temporário próprio, apagado no fim, com fila de até 2 pedidos ao mesmo tempo e tempo máximo de 600 s.

  Modelos: orchestrator-neon e orchestrator-argon. Endereço interno http://thainan-agy-ponte_web_1:8648/v1; chave = senha deste app.

  Login do agy (conta Google): abra /login (usuário qualquer, senha do app), clique em Iniciar login, entre no Google pelo link e cole o código. O login fica salvo em data/home.

  O agy é baixado do GitHub (google-antigravity/antigravity-cli, último release Linux x64) e atualizado a cada reinício do app.
developer: Thainan Caldeira
