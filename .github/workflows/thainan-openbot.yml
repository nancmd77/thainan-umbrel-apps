name: Build and Publish thainan-openbot Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "thainan-openbot/image/**"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OpenBot image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: thainan-openbot/image
          file: thainan-openbot/image/Dockerfile
          push: true
          tags: |
            ghcr.io/nancmd77/thainan-openbot:0.61.0-r4
            ghcr.io/nancmd77/thainan-openbot:latest

      - name: Output image digest
        run: |
          echo "Imagem publicada com sucesso."
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Atualize thainan-openbot/docker-compose.yml com: ghcr.io/nancmd77/thainan-openbot:0.61.0-r4@${{ steps.docker_build.outputs.digest }}"
