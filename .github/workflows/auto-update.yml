name: Auto-update apps

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: bump
        run: python3 .github/scripts/bump.py
      - name: Commit
        if: steps.bump.outputs.changed != ''
        run: |
          git config user.name "appstore-bot"
          git config user.email "appstore-bot@users.noreply.github.com"
          git add -A
          git commit -m "auto-update: ${{ steps.bump.outputs.changed }}"
          # trava de segredos: se o commit novo tiver segredo, não publica
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --log-opts="-1" . || { echo "Segredo detectado no commit; push cancelado."; exit 1; }
          git push
