name: OpenBot upstream (robô diário)

# Detecta release nova em nightly-labs/openbot, reconstrói a imagem thainan-openbot
# e só commita em main depois do build e do smoke test passarem.
# O commit usa GITHUB_TOKEN, e o GitHub não dispara workflows com esse token, então
# thainan-openbot.yml (push em image/**) NÃO roda de novo e o digest fixado continua válido.

on:
  schedule:
    - cron: "40 9 * * *" # 09:40 UTC = 06:40 em São Paulo
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: openbot-upstream
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detectar release nova do OpenBot
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/openbot_upstream.py detect --root .

      - name: Aplicar nova versão nos arquivos (sem commit)
        if: steps.detect.outputs.changed == 'true'
        env:
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          DIGEST: ${{ steps.detect.outputs.digest }}
          RELEASE_URL: ${{ steps.detect.outputs.release_url }}
        run: |
          python3 .github/scripts/openbot_upstream.py apply --root . \
            --version "$NEW_VERSION" --digest "$DIGEST" --release-url "$RELEASE_URL" --revision 1

      - name: Ler revisão da imagem
        if: steps.detect.outputs.changed == 'true'
        id: revision
        run: echo "tag=$(tr -d '[:space:]' < thainan-openbot/image/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.detect.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.detect.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OpenBot image
        if: steps.detect.outputs.changed == 'true'
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: thainan-openbot/image
          file: thainan-openbot/image/Dockerfile
          push: true
          tags: |
            ghcr.io/nancmd77/thainan-openbot:${{ steps.revision.outputs.tag }}
            ghcr.io/nancmd77/thainan-openbot:latest

      - name: Smoke test da imagem publicada
        if: steps.detect.outputs.changed == 'true'
        run: |
          IMAGE="ghcr.io/nancmd77/thainan-openbot@${{ steps.docker_build.outputs.digest }}"
          docker run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -e
            test "$(id -u)" = 1000
            test -x /opt/OpenBot/app/resources/hosting/openbot-container
            test -x /usr/bin/tini
            test -x /usr/local/bin/md
            test -x /usr/local/bin/decide
            command -v openbox xdotool scrot >/dev/null
            sudo -n true
            test -z "${NO_AT_BRIDGE+x}"
          '

      - name: Fixar digest no docker-compose
        if: steps.detect.outputs.changed == 'true'
        run: |
          python3 .github/scripts/openbot_upstream.py pin --root . \
            --digest "${{ steps.docker_build.outputs.digest }}"

      - name: Commitar, criar tag e publicar em main
        if: steps.detect.outputs.changed == 'true'
        env:
          REV: ${{ steps.revision.outputs.tag }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
        run: |
          git config user.name "appstore-bot"
          git config user.email "appstore-bot@users.noreply.github.com"
          git add thainan-openbot/image/Dockerfile thainan-openbot/image/VERSION \
            thainan-openbot/docker-compose.yml thainan-openbot/umbrel-app.yml
          git commit -m "auto-update: thainan-openbot -> $REV (base OpenBot v$NEW_VERSION)"
          git pull --rebase origin main
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --log-opts="-1" . || { echo "Segredo detectado no commit; push cancelado."; exit 1; }
          git tag -a "thainan-openbot-v$REV" -m "thainan-openbot $REV"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/thainan-openbot-v$REV"

      - name: Abrir issue se algo falhar
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.detect.outputs.new_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "OpenBot ${NEW_VERSION:-upstream}: atualização automática falhou" \
            --body "A atualização automática do thainan-openbot falhou. O push é atômico (main + tag): se falhou, nenhum dos dois mudou. Veja a run e reexecute com workflow_dispatch. Log: $RUN_URL"
