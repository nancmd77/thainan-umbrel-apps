name: Build and Publish thainan-nod Images

# Compila as três imagens do Nod (n8n-io/nod) no commit fixado em thainan-nod/image/UPSTREAM_COMMIT.
# Tags: ghcr.io/nancmd77/thainan-nod:{server,browser,workspace}-<commit curto>.
# Fixar os digests no thainan-nod/docker-compose.yml continua sendo passo manual.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "thainan-nod/image/**"
      - ".github/workflows/thainan-nod.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: deployment/self-host/Dockerfile
          - name: browser
            file: Dockerfile.browser
          - name: workspace
            file: Dockerfile.workspace
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream commit
        id: rev
        run: |
          c=$(tr -d '[:space:]' < thainan-nod/image/UPSTREAM_COMMIT)
          echo "commit=$c" >> "$GITHUB_OUTPUT"
          echo "short=${c:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: n8n-io/nod
          ref: ${{ steps.rev.outputs.commit }}
          path: nod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: nod
          file: nod/${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/nancmd77/thainan-nod:${{ matrix.name }}-${{ steps.rev.outputs.short }}
      - run: echo "${{ matrix.name }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
