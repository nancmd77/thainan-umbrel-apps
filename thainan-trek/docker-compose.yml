version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-trek_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: mauriceboe/trek:latest@sha256:7935eeb96db3202b5af896951fd96379d6eb4d3608ce93a1f2e8f850e10a2257
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: "3000"
      ENCRYPTION_KEY: "${APP_THAINAN_TREK_ENCRYPTION_KEY}"
      TZ: America/Sao_Paulo
      TRUST_PROXY: "1"
      ALLOW_INTERNAL_NETWORK: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
