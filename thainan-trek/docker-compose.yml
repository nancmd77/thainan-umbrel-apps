version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-trek_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: mauriceboe/trek:latest@sha256:6a6bb48bdf5c71314717ef3f1de8da51855d55f68e911ab68fd963644c7416d9
    restart: on-failure
    environment:
      NODE_ENV: production
      PORT: "3000"
      ENCRYPTION_KEY: "${APP_THAINAN_TREK_ENCRYPTION_KEY}"
      TZ: America/Sao_Paulo
      TRUST_PROXY: "1"
      ALLOW_INTERNAL_NETWORK: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
