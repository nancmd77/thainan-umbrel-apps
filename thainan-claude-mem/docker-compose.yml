          cd "$$APP/pkg"
          npm init -y >/dev/null
          npm install --omit=dev --no-audit --no-fund "claude-mem@$$V" "pg@8"
          cd "$$APP/pkg/node_modules/claude-mem/plugin"
          ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          npm install -g --no-audit --no-fund "bun@$$BUNV"
          rm -f "$$APP"/ok-*
