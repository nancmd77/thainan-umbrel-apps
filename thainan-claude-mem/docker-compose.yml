            out="$$(bun "$$S" server api-key create --scope "$$scopes" --name "nonve-$$label" 2>/dev/null || true)"
            res="$$(printf '%s' "$$out" | node "$$APP/swap.cjs" "$$hash" 2>&1 || true)"
            echo "[cmem-boot] $$label: $$res"
            case "$$res" in ok*) touch "/data/claude-mem/boot/$$hash";; esac
          done
        }

        cat > "$$APP/swap.cjs" <<'JS'
        const { Client } = require("/rt/pkg/node_modules/pg");
        let s = ""; process.stdin.on("data", d => s += d).on("end", async () => {
