version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-subdominios_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8791:80"
    environment:
      DOMAIN: nonve.dpdns.org
      TARGET_HOST: 10.203.0.1
      EXCLUDE: "cloudflared tailscale murmur cobalt thainan-subdominios"
      INTERVAL: "30"
      REF: main
    volumes:
      - ${APP_DATA_DIR}/..:/apps:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - wget -qO /run.sh "https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$${REF}/thainan-subdominios/run.sh" && exec sh /run.sh
