version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-subdominios_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8791:80"
    environment:
      UPSTREAM: "10.203.0.1:80"
      INTERVAL: "300"
      REF: main
      TILES: >-
        20128=nonve-9router.eu1.netbird.services
        13119=nonve-ntfy.eu1.netbird.services
        3001=nonve-llm.eu1.netbird.services
        8233=nonve-links.eu1.netbird.services
        5230=nonve-memos.eu1.netbird.services
        8088=nonve-opengym.eu1.netbird.services
        3100=nonve-yuvomi.eu1.netbird.services
        8519=nonve-videokb.eu1.netbird.services
        8502=nonve-notebook.eu1.netbird.services
        8550=nonve-prospeccao.eu1.netbird.services
        8765=selah.eu1.netbird.services
    entrypoint: ["/bin/sh", "-c"]
    command:
      - wget -qO /run.sh "https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$${REF}/thainan-subdominios/run.sh" && exec sh /run.sh
