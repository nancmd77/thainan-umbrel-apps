version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-subdominios_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8791:80"
      - "8792-8797:8792-8797"
    environment:
      UPSTREAM: "10.203.0.1:80"
      INTERVAL: "300"
      DIRETOS: >-
        8792=changedetection-io_app_1:5000
        8793=obsidian_server_1:3000
        8794=netbird_web_1:80
        8795=thainan-anytype_web_1:8080
        8796=10.21.0.1:8533
        8797=10.203.0.2:7317
      REF: main
      TILES: >-
        20128=nonve-9router.eu1.netbird.services
        13119=nonve-ntfy.eu1.netbird.services
        3001=nonve-llm.eu1.netbird.services
        8233=nonve-links.eu1.netbird.services
        5230=nonve-memos.eu1.netbird.services
        8088=nonve-opengym.eu1.netbird.services
        3100=nonve-yuvomi.eu1.netbird.services
        8519=nonve-videokb.eu1.netbird.services
        8502=nonve-notebook.eu1.netbird.services
        8550=nonve-prospeccao.eu1.netbird.services
        8765=selah.eu1.netbird.services
        8560=nonve-radar.eu1.netbird.services
        8095=nonve-adguard.eu1.netbird.services
        8523=nonve-anytype.eu1.netbird.services
        5037=nonve-changedetection.eu1.netbird.services
        9009=nonve-cobalt.eu1.netbird.services
        8532=nonve-desempenho.eu1.netbird.services
        8005=nonve-fizzy.eu1.netbird.services
        2283=nonve-immich.eu1.netbird.services
        3063=nonve-maybe.eu1.netbird.services
        8479=nonve-netbird.eu1.netbird.services
        3435=nonve-obsidian.eu1.netbird.services
        3064=nonve-sure.eu1.netbird.services
        8790=nonve-acesso.eu1.netbird.services
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until wget -T 15 -qO /run.sh "https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/$${REF}/thainan-subdominios/run.sh"; do echo "sem rede, de novo em 10 s"; sleep 10; done; exec sh /run.sh
