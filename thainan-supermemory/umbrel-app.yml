id: thainan-supermemory
name: Supermemory Local
tagline: Motor de memória e continual learning para agentes de IA
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-supermemory/icon.png
category: AI
version: "1.0.1"
port: 8567
description: >-
  Supermemory Local (supermemory-server) no hardware do Nonve: memória vetorial e contextual persistida em disco, busca híbrida (BM25 + embeddings vetoriais locais bge-base-en-v1.5) e integração com o 9Router para geração de perfis e reescrita de queries com Gemini.

  O llmproxy local (127.0.0.1:20129) traduz chamadas de chat completion para o 9Router (ag/gemini-3.8-flash-high).

  A chave sm_ gerada no primeiro boot é gravada em app-data/data/local_key (modo 600) e redigida dos logs para máxima segurança.
