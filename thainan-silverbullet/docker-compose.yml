version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-silverbullet_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
