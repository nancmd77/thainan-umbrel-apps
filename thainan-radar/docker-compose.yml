version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: thainan-radar_web_1
      APP_PORT: 8561
      PROXY_AUTH_ADD: "false"
  web:
    image: node:22-alpine
    restart: unless-stopped
    ports:
      - "8561:8561"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      REF: main
      PORT: "8561"
      DATA_DIR: /data
      WEB_DIR: /app/web
      WRITE_TOKEN_SHA256: "f5936d9242ba1bb8585fcb39d9919a90b7d2eb481ece206a96b5e3de60bb7607"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/boot.mjs <<'JS'
        import fs from "node:fs"; import path from "node:path";
        const B = `https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/${process.env.REF || "main"}/thainan-radar/`;
        for (const f of ["server.mjs", "web/index.html", "web/assets/app.js", "web/assets/app.css"]) {
          const dst = path.join("/app", f), cache = path.join("/data/cache", f);
          fs.mkdirSync(path.dirname(dst), { recursive: true }); fs.mkdirSync(path.dirname(cache), { recursive: true });
          try { const r = await fetch(B + f + "?t=" + Date.now()); if (!r.ok) throw new Error(r.status); const b = Buffer.from(await r.arrayBuffer()); fs.writeFileSync(dst, b); fs.writeFileSync(cache, b); console.log("baixado", f, b.length); }
          catch (e) { console.log("falhou", f, String(e), "usando cache"); fs.copyFileSync(cache, dst); }
        }
        JS
        node /tmp/boot.mjs && exec node /app/server.mjs
