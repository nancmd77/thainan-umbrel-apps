gallery: []
releaseNotes: >-
  Segurança: a chave de criptografia saiu do repositório e passa a ser gerada por máquina a partir do APP_SEED do Umbrel. Na primeira partida, se existir data/.encryption_key.old, as chaves de API salvas são recriptografadas com a chave nova (com backup e verificação; se falhar, o app não sobe e nada é alterado).
