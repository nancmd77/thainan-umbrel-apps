manifestVersion: 1
id: thainan-cua
name: Cua
tagline: Um computador Linux leve pra IA navegar, com a tela ao vivo só pra assistir
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-cua/icon.png
category: AI
version: "24.04-slim-1-r9"
port: 8622
description: >-
  Desktop Ubuntu 24.04 enxuto (XFCE + Chromium) feito pra agentes de IA, do projeto Cua. Os agentes controlam pelo MCP do Cua Driver (navegador por referências de elementos, janelas, teclado e mouse) e você acompanha a tela ao vivo ao abrir o app: o link gerado é só de assistir (sem mouse, sem teclado, sem área de transferência, sem arquivos) e vale 24 horas.

  MCP para o LiteLLM: http://IP-do-Nonve:8624/mcp (só o /mcp, com o token Bearer em /Apps/thainan-cua/data/segredo/env-token). Pela página o /mcp fica bloqueado. Gasta cerca de 250 MB parado; o navegador soma conforme o uso (limite de 3 GB).
developer: Cua AI
website: https://cua.ai
submitter: Thainan Caldeira
submission: https://github.com/nancmd77/thainan-umbrel-apps
repo: https://github.com/trycua/cua
support: https://github.com/trycua/cua/issues
gallery: []
releaseNotes: >-
  r9: Chromium sempre maximizado e em foco (desktop só de navegador).
  r8: extensão BrowserSkill (Tencent) no Chromium e ponte do bsk mcp pro Fast Agent (teste).
  r7: o Chromium agora abre de verdade quando o agent-browser chama (a r6 tentava e falhava).
  r6: o Chromium abre sozinho quando o agent-browser chama e ele está fechado (depois de reiniciar o app ele não abria).
  r5: o Chromium liga com a porta de depuração (CDP) e um encaminhador na 9223 que só aceita o Fast Agent, pra o agent-browser dirigir o navegador visível bem mais rápido.
  r4: o visualizador manda o cookie do login (NetBird SSO) nas chamadas à API; antes dava "Cannot reach the sandbox".
  r3: visualizador também na porta 8625, pra um endereço HTTPS com login (NetBird) na frente; o visualizador precisa de HTTPS.
  r2: nome do app agora é só Cua.
  r1: MCP numa porta própria (8624) pro LiteLLM alcançar, e a página não cai mais se o desktop demorar a ligar. Primeira versão: imagem ghcr.io/trycua/linux:24.04-slim fixada por digest, visualizador só de assistir e MCP para o LiteLLM.
dependencies: []
path: ""
