id: thainan-anamnese
name: Anamnese
tagline: Base de conhecimento pessoal do nan (lembranças, wiki, busca e MCP)
icon: https://raw.githubusercontent.com/nancmd77/thainan-umbrel-apps/main/thainan-anamnese/icon.png
category: developer
version: "0.2.1"
port: 8590
description: >-
  Anamnese guarda o que entra das fontes (sessões dos agentes, Video KB, gravações de voz) como bruto, segmentos e lembranças
  (método Saraev: SQLite FTS5/BM25 com recência). Uma lembrança nova pode substituir a antiga. Wiki por tema compilada só quando você pede.

  Telas pela porta do app (com login do Umbrel). API e MCP (buscar, gravar, status) na porta 8591 com Bearer token.
  IA e transcrição usam as chaves já salvas no Video KB (9Router e ElevenLabs), só leitura.
